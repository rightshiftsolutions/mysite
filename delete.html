<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delete Gym Account</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f5f5f5;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .container{
      width:350px;
      background:white;
      padding:25px;
      border-radius:12px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h2{
      text-align:center;
      margin-bottom:20px;
    }

    input{
      width:100%;
      padding:12px;
      margin-bottom:15px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:16px;
    }

    .login-btn{
      background:#007bff;
      color:white;
    }

    .delete-btn{
      background:red;
      color:white;
      margin-top:10px;
    }

    .hidden{
      display:none;
    }

    .message{
      margin-top:15px;
      text-align:center;
      font-size:14px;
    }
  </style>
</head>
<body>

  <div class="container">

    <h2>Delete Gym Account</h2>

    <!-- LOGIN FORM -->
    <div id="loginSection">
      <input type="text" id="login" placeholder="Phone Number" />
      <input type="password" id="password" placeholder="Password" />

      <button class="login-btn" onclick="loginUser()">
        Login
      </button>
    </div>

    <!-- DELETE SECTION -->
    <div id="deleteSection" class="hidden">
      <p style="text-align:center; margin-bottom:15px;">
        Logged in successfully
      </p>

      <button class="delete-btn" onclick="deleteAccount()">
        Delete My Account
      </button>
    </div>

    <div class="message" id="message"></div>

  </div>

  <script>

    let token = "";
    let userPassword = "";

    // LOGIN API
    async function loginUser() {

      const login = document.getElementById("login").value;
      const password = document.getElementById("password").value;

      userPassword = password;

      try {

        const response = await fetch("https://www.api.gymgurus.in/gym/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            login: login,
            password: password
          })
        });

        const data = await response.json();

        if(response.ok){

          token = data.token;

          document.getElementById("message").innerHTML =
            "Login Successful";

          document.getElementById("loginSection")
            .classList.add("hidden");

          document.getElementById("deleteSection")
            .classList.remove("hidden");

        } else {

          document.getElementById("message").innerHTML =
            data.message || "Login Failed";

        }

      } catch(error){

        document.getElementById("message").innerHTML =
          "Something went wrong";

      }
    }

    // DELETE ACCOUNT API
    async function deleteAccount() {

      const confirmDelete = confirm(
        "Are you sure you want to permanently delete your gym account?"
      );

      if(!confirmDelete) return;

      try {

        const response = await fetch(
          "https://www.api.gymgurus.in/gym/delete-gym",
          {
            method: "DELETE",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({
              password: userPassword
            })
          }
        );

        const data = await response.json();

        if(response.ok){

          document.getElementById("message").innerHTML =
            "Account deleted successfully";

          document.getElementById("deleteSection")
            .classList.add("hidden");

        } else {

          document.getElementById("message").innerHTML =
            data.message || "Delete failed";

        }

      } catch(error){

        document.getElementById("message").innerHTML =
          "Something went wrong";

      }
    }

  </script>

</body>
</html>
