<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Profile · LoanFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/forms.css" rel="stylesheet">
<link href="../css/responsive.css" rel="stylesheet">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LoanFlow">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="../assets/icons/icon-152x152.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="../assets/splash/apple-splash-2796-1290.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="../assets/splash/apple-splash-2556-1179.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="../assets/splash/apple-splash-2532-1170.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="../assets/splash/apple-splash-1334-750.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192x192.png">
<link rel="icon" type="image/svg+xml" href="../assets/icons/icon.svg">
</head>
<body>

<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-col">
    <div id="navbar-mount"></div>

    <main class="main-content page-enter">
      <div class="mb-4">
        <h3 class="fw-semibold mb-1">Profile</h3>
        <p class="section-sub mb-0">Manage your personal information and account status.</p>
      </div>

      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card p-4 text-center">
            <div class="row-avatar mx-auto mb-3" style="width:72px;height:72px;font-size:1.4rem;" id="profileAvatar">—</div>
            <div class="fw-semibold fs-5" id="profileNameHeader">—</div>
            <div class="text-secondary small mb-3" id="profileMemberSince">—</div>
            <button class="btn btn-soft-danger w-100" id="deleteAccountBtn"><i class="bi bi-trash me-1"></i>Delete Account</button>
          </div>
        </div>

        <div class="col-lg-8">
          <form id="profileForm" class="card p-4" novalidate>
            <div class="section-title mb-3">Edit Profile</div>
            <div class="field-group">
              <label class="form-label required-dot">Full name</label>
              <input type="text" class="form-control" id="pFullName" required>
            </div>
            <div class="row">
              <div class="col-md-6">
                <div class="field-group">
                  <label class="form-label required-dot">Email</label>
                  <input type="email" class="form-control" id="pEmail" required>
                </div>
              </div>
              <div class="col-md-6">
                <div class="field-group">
                  <label class="form-label required-dot">Mobile</label>
                  <input type="tel" class="form-control" id="pMobile" pattern="[0-9]{10}" required>
                </div>
              </div>
            </div>
            <div class="field-group">
              <label class="form-label required-dot">Status</label>
              <select class="form-select" id="pStatus" required>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
            <button type="submit" class="btn btn-gradient align-self-start px-4" id="saveProfileBtn"><span class="btn-text"><i class="bi bi-save me-1"></i>Update</span></button>
          </form>
        </div>
      </div>
    </main>

    <footer class="app-footer">© 2026 LoanFlow. All rights reserved.</footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/profile.js"></script>
<script src="../js/pwa.js"></script>
</body>
</html>
