<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Record Disbursement · LoanFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/forms.css" rel="stylesheet">
<link href="../css/responsive.css" rel="stylesheet">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LoanFlow">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="../assets/icons/icon-152x152.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="../assets/splash/apple-splash-2796-1290.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="../assets/splash/apple-splash-2556-1179.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="../assets/splash/apple-splash-2532-1170.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="../assets/splash/apple-splash-1334-750.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192x192.png">
<link rel="icon" type="image/svg+xml" href="../assets/icons/icon.svg">
</head>
<body>

<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-col">
    <div id="navbar-mount"></div>

    <main class="main-content page-enter">
      <div class="mb-4">
        <h3 class="fw-semibold mb-1">Record a Disbursement</h3>
        <p class="section-sub mb-0">Log funds sent out against an active loan, with optional witness and proof.</p>
      </div>

      <div class="row g-4 justify-content-center">
        <div class="col-lg-8">
          <form id="createDisbursementForm" class="card p-4" novalidate>
            <div class="row">
              <div class="col-md-6">
                <div class="field-group">
                  <label class="form-label required-dot">Loan</label>
                  <select class="form-select" id="dLoanId" required>
                    <option value="">Loading loans…</option>
                  </select>
                </div>
              </div>
              <div class="col-md-6">
                <div class="field-group">
                  <label class="form-label required-dot">Amount</label>
                  <input type="number" min="1" step="0.01" class="form-control mono" id="dAmount" placeholder="25000" required>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6">
                <div class="field-group">
                  <label class="form-label required-dot">Payment method</label>
                  <select class="form-select" id="dPaymentMethod" required>
                    <option value="" selected disabled>Choose…</option>
                    <option value="bank_transfer">Bank transfer</option>
                    <option value="cash">Cash</option>
                    <option value="upi">UPI</option>
                    <option value="cheque">Cheque</option>
                  </select>
                </div>
              </div>
              <div class="col-md-6">
                <div class="field-group">
                  <label class="form-label required-dot">Transaction date</label>
                  <input type="date" class="form-control" id="dTransactionDate" required>
                </div>
              </div>
            </div>

            <div class="field-group d-none" id="cashLocationGroup">
              <label class="form-label">Cash location</label>
              <input type="text" class="form-control" id="dCashLocation" placeholder="e.g. Branch office, Jaipur">
            </div>

            <div class="form-section-label">Witness (optional)</div>
            <div class="row">
              <div class="col-md-6">
                <div class="field-group">
                  <label class="form-label">Witness name</label>
                  <input type="text" class="form-control" id="dWitnessName" placeholder="Full name">
                </div>
              </div>
              <div class="col-md-6">
                <div class="field-group">
                  <label class="form-label">Witness mobile</label>
                  <input type="tel" class="form-control" id="dWitnessMobile" placeholder="9876543210">
                </div>
              </div>
            </div>

            <div class="form-section-label">Proof & notes</div>
            <div class="field-group">
              <label class="form-label">Screenshot (jpg, jpeg, png, webp — max 5MB)</label>
              <div class="dropzone" id="screenshotDropzone">
                <i class="bi bi-cloud-arrow-up"></i>
                <div>Click or drag a screenshot here</div>
                <input type="file" id="screenshotInput" accept=".jpg,.jpeg,.png,.webp" hidden>
              </div>
              <img id="screenshotPreview" class="preview-thumb d-none" alt="Screenshot preview">
            </div>

            <div class="field-group mb-2">
              <label class="form-label">Remarks</label>
              <textarea class="form-control" id="dRemarks" rows="3" placeholder="Optional notes…"></textarea>
            </div>

            <button type="submit" class="btn btn-gradient px-4 py-2 align-self-start" id="submitDisbursementBtn"><span class="btn-text"><i class="bi bi-send-check me-1"></i>Save Disbursement</span></button>
          </form>
        </div>
      </div>
    </main>

    <footer class="app-footer">© 2026 LoanFlow. All rights reserved.</footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => { LoanFlow.requireAuth(); LoanFlow.initLayout('Record Disbursement'); });</script>
<script src="../js/disbursement.js"></script>
<script src="../js/pwa.js"></script>
</body>
</html>
