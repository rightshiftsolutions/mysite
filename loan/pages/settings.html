<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Settings · LoanFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/forms.css" rel="stylesheet">
<link href="../css/responsive.css" rel="stylesheet">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LoanFlow">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="../assets/icons/icon-152x152.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="../assets/splash/apple-splash-2796-1290.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="../assets/splash/apple-splash-2556-1179.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="../assets/splash/apple-splash-2532-1170.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="../assets/splash/apple-splash-1334-750.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192x192.png">
<link rel="icon" type="image/svg+xml" href="../assets/icons/icon.svg">
</head>
<body>

<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-col">
    <div id="navbar-mount"></div>

    <main class="main-content page-enter">
      <div class="mb-4">
        <h3 class="fw-semibold mb-1">Settings</h3>
        <p class="section-sub mb-0">Preferences for how LoanFlow works for you.</p>
      </div>

      <div class="card p-4 mb-3">
        <div class="section-title mb-3">Notifications</div>
        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" role="switch" checked>
          <label class="form-check-label">Email me when an installment is due soon</label>
        </div>
        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" role="switch" checked>
          <label class="form-check-label">Email me when a loan becomes overdue</label>
        </div>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" role="switch">
          <label class="form-check-label">Weekly portfolio summary</label>
        </div>
      </div>

      <div class="card p-4">
        <div class="section-title mb-3">API Connection</div>
        <p class="section-sub mb-2">LoanFlow is currently pointed at:</p>
        <code class="mono">http://localhost:5000</code>
      </div>
    </main>

    <footer class="app-footer">© 2026 LoanFlow. All rights reserved.</footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => { LoanFlow.requireAuth(); LoanFlow.initLayout('Settings'); });</script>
<script src="../js/pwa.js"></script>
</body>
</html>
