<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings · LoanFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/forms.css" rel="stylesheet">
<link href="../css/responsive.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-col">
    <div id="navbar-mount"></div>

    <main class="main-content page-enter">
      <div class="mb-4">
        <h3 class="fw-semibold mb-1">Settings</h3>
        <p class="section-sub mb-0">Preferences for how LoanFlow works for you.</p>
      </div>

      <div class="card p-4 mb-3">
        <div class="section-title mb-3">Notifications</div>
        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" role="switch" checked>
          <label class="form-check-label">Email me when an installment is due soon</label>
        </div>
        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" role="switch" checked>
          <label class="form-check-label">Email me when a loan becomes overdue</label>
        </div>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" role="switch">
          <label class="form-check-label">Weekly portfolio summary</label>
        </div>
      </div>

      <div class="card p-4">
        <div class="section-title mb-3">API Connection</div>
        <p class="section-sub mb-2">LoanFlow is currently pointed at:</p>
        <code class="mono">http://localhost:5000</code>
      </div>
    </main>

    <footer class="app-footer">© 2026 LoanFlow. All rights reserved.</footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => { LoanFlow.requireAuth(); LoanFlow.initLayout('Settings'); });</script>
</body>
</html>
