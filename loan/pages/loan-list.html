<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Loans · LoanFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/tables.css" rel="stylesheet">
<link href="../css/responsive.css" rel="stylesheet">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LoanFlow">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="../assets/icons/icon-152x152.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="../assets/splash/apple-splash-2796-1290.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="../assets/splash/apple-splash-2556-1179.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="../assets/splash/apple-splash-2532-1170.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="../assets/splash/apple-splash-1334-750.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192x192.png">
<link rel="icon" type="image/svg+xml" href="../assets/icons/icon.svg">
</head>
<body>

<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-col">
    <div id="navbar-mount"></div>

    <main class="main-content page-enter">
      <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div>
          <h3 class="fw-semibold mb-1">Loans</h3>
          <p class="section-sub mb-0">Every loan you've issued, with live status.</p>
        </div>
        <a href="create-loan.html" class="btn btn-gradient"><i class="bi bi-plus-lg me-1"></i>New Loan</a>
      </div>

      <div class="card table-card">
        <div class="table-toolbar">
          <div class="search-pill">
            <i class="bi bi-search"></i>
            <input type="text" id="loanSearch" placeholder="Search by borrower or reason…">
          </div>
          <select class="form-select form-select-sm w-auto" id="loanStatusFilter">
            <option value="">All statuses</option>
            <option value="pending">Pending</option>
            <option value="active">Active</option>
            <option value="completed">Completed</option>
            <option value="overdue">Overdue</option>
          </select>
          <span class="small text-secondary ms-auto" id="loanCount"></span>
        </div>
        <div class="table-scroll">
          <table class="tbl">
            <thead><tr><th>ID</th><th>Borrower / Reason</th><th>Amount</th><th>Start</th><th>Due</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="loanListBody"></tbody>
          </table>
        </div>
        <div class="table-pagination">
          <span class="small text-secondary"></span>
          <ul class="pagination" id="loanPagination"></ul>
        </div>
      </div>
    </main>

    <footer class="app-footer">© 2026 LoanFlow. All rights reserved.</footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => { LoanFlow.requireAuth(); LoanFlow.initLayout('Loans'); });</script>
<script src="../js/table.js"></script>
<script src="../js/loan.js"></script>
<script src="../js/pwa.js"></script>
</body>
</html>
