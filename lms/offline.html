<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LMS Arena – Offline</title>
  <style>
    :root {
      --bg-deep: #0d0f1c;
      --neon-yellow: #ffe135;
      --neon-cyan: #00e5ff;
      --text-primary: #f0f2ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: 'Nunito', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 1.5rem;
      padding: 3rem 2rem;
      max-width: 400px;
      width: 100%;
    }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.75rem; color: var(--neon-yellow); }
    p { color: rgba(240,242,255,0.6); margin-bottom: 2rem; line-height: 1.6; }
    button {
      background: var(--neon-yellow);
      color: #0d0f1c;
      border: none;
      border-radius: 3rem;
      padding: 0.8rem 2rem;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      touch-action: manipulation;
    }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>No internet connection. Check your network and try again. Your progress is saved locally.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
