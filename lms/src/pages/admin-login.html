<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - LMS Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

  <!-- Navbar -->
  <div id="navbar-container"></div>

  <!-- Auth Layout -->
  <main class="auth-wrapper">
    <div class="card auth-card shadow-premium slide-up">
      <div class="card-body p-4 rounded-inputs">
        
        <div class="auth-header">
          <img src="../assets/logo.png" alt="LMS Logo" class="auth-logo" onerror="this.src='https://placehold.co/120x120?text=LMS'">
          <h1 class="auth-title">Admin Dashboard</h1>
          <p class="auth-subtitle">Log in with your administrator credentials</p>
        </div>

        <!-- Alert Container -->
        <div id="alert-container"></div>

        <form id="admin-login-form" novalidate>
          <!-- Email Input -->
          <div class="mb-3">
            <label for="admin-email" class="form-label fw-semibold">Admin Email</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-lock text-secondary"></i></span>
              <input type="email" class="form-control border-start-0" id="admin-email" placeholder="admin@example.com" required autocomplete="email">
              <div class="invalid-feedback">Please enter a valid admin email.</div>
            </div>
          </div>

          <!-- Password Input -->
          <div class="mb-3">
            <label for="admin-password" class="form-label fw-semibold">Password</label>
            <div class="password-toggle-wrapper">
              <input type="password" class="form-control pe-5" id="admin-password" placeholder="Enter your password" required autocomplete="current-password">
              <button type="button" class="password-toggle-btn" id="password-toggle-btn" aria-label="Toggle Password Visibility">
                <i class="bi bi-eye" id="password-toggle-icon"></i>
              </button>
              <div class="invalid-feedback">Password is required.</div>
            </div>
          </div>

          <!-- Remember me checkbox -->
          <div class="mb-4 form-check">
            <input type="checkbox" class="form-check-input" id="remember-me">
            <label class="form-check-label text-secondary small" for="remember-me">Remember Admin Login</label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-dark w-100 py-2.5 fw-semibold mb-3 rounded-3" id="submit-btn" style="background-color: #1e293b; border: none;">
            Access Console
          </button>
        </form>

        <hr class="text-slate-300">

        <!-- Back Link -->
        <div class="text-center">
          <a href="login.html" class="text-secondary small fw-semibold text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to Student & Teacher Portal</a>
        </div>

      </div>
    </div>
  </main>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Initialization and Form Submission Module -->
  <script type="module">
    import { renderNavbar } from '../components/navbar.js';
    import { handleAdminLogin, setupPasswordToggle } from '../js/auth.js';

    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('navbar-container');
      setupPasswordToggle('admin-password', 'password-toggle-btn', 'password-toggle-icon');
      
      const adminForm = document.getElementById('admin-login-form');
      adminForm.addEventListener('submit', handleAdminLogin);
    });
  </script>
</body>
</html>
