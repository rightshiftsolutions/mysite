<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Details - LMS Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/teacher.css">
  <link rel="stylesheet" href="../css/courses.css">
</head>
<body class="bg-light">

  <div class="teacher-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Workspace -->
    <main class="teacher-main">
      <!-- Top Navbar -->
      <div id="header-container"></div>

      <!-- Page Content -->
      <div class="p-4 container-fluid">
        <div class="mb-4">
          <a href="./my-courses.html" class="text-secondary small fw-semibold text-decoration-none">
            <i class="bi bi-arrow-left"></i> Back to Courses List
          </a>
        </div>

        <div class="row">
          <div class="col-lg-10 mx-auto" id="course-details-container">
            <div class="text-center py-5 text-muted">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <div class="mt-2 small">Loading course profile...</div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Route guards and controllers -->
  <script type="module" src="../js/authGuard.js"></script>
  <script type="module" src="../js/course.js"></script>
</body>
</html>
