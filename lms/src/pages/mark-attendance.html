<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mark Attendance - LMS Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/student.css">
  <link rel="stylesheet" href="../css/forms.css">
</head>
<body>

  <div class="student-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Workspace -->
    <main class="student-main">
      <!-- Top Header -->
      <div id="header-container"></div>

      <!-- Page Content -->
      <div class="p-4 container-fluid">
        <div class="mb-4">
          <h1 class="h3 fw-bold text-slate-800 mb-1">Check-in Attendance</h1>
          <p class="text-secondary small mb-0">Select your active course classroom to check-in for attendance verification.</p>
        </div>

        <div class="row">
          <div class="col-lg-6 mx-auto">
            <!-- Check-in Success Animation placeholder -->
            <div class="card border-0 shadow-sm rounded-4 bg-white p-4 mb-4" id="success-animation-container" style="display: none;"></div>

            <!-- Attendance check-in Form -->
            <div class="card form-card-custom" id="attendance-form-card">
              <div class="form-card-header">
                <h5 class="fw-bold mb-0 text-slate-800">Class Check-In</h5>
              </div>
              <div class="form-card-body bg-white rounded-bottom-4">
                <form id="mark-self-attendance-form" novalidate>
                  
                  <!-- Active Class Info -->
                  <div id="active-class-container" class="mb-4">
                    <div class="text-center py-3 text-muted">
                      <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
                      <div>Checking active classrooms...</div>
                    </div>
                  </div>

                  <!-- Submit button controls -->
                  <div class="d-grid" id="submit-btn-wrapper" style="display: none;">
                    <button type="submit" class="btn btn-submit-custom py-2.5 fw-semibold" id="submit-btn">
                      <i class="bi bi-geo-alt-fill me-1"></i>Mark Present
                    </button>
                  </div>
                </form>
              </div>
            </div>

          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Route guards and controllers -->
  <script type="module" src="../js/authGuard.js"></script>
  <script type="module" src="../js/attendance.js"></script>
</body>
</html>
