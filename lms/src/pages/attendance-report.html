<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Report - LMS Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/teacher.css">
  <link rel="stylesheet" href="../css/table.css">
  <link rel="stylesheet" href="../css/reports.css">
  <link rel="stylesheet" href="../css/filters.css">
</head>
<body>

  <div class="teacher-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Workspace -->
    <main class="teacher-main">
      <!-- Navbar Header -->
      <div id="header-container"></div>

      <!-- Page Content -->
      <div class="p-4 container-fluid">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
          <div>
            <h1 class="h3 fw-bold text-slate-800 mb-1">Attendance Report</h1>
            <p class="text-secondary small mb-0">Compute classroom statistics, attendance percentages, and download summaries.</p>
          </div>
          
          <!-- PDF Download -->
          <div class="export-btn-group">
            <button class="btn btn-primary rounded-pill px-3 py-1.5" id="btn-download-report-pdf">
              <i class="bi bi-file-earmark-pdf me-1"></i>Download PDF
            </button>
          </div>
        </div>

        <!-- Course & Date Selection Card -->
        <div class="filters-card-wrapper mb-4">
          <div class="row g-3 align-items-end">
            <!-- Course select -->
            <div class="col-md-5">
              <label class="form-label filters-label-custom">Select Course</label>
              <select class="form-select form-input-custom" id="report-course-select" required>
                <option value="" disabled selected>Select Course</option>
              </select>
            </div>

            <!-- Date select -->
            <div class="col-md-4">
              <label class="form-label filters-label-custom">Select Date</label>
              <input type="date" class="form-control form-input-custom" id="report-date-select">
            </div>

            <!-- Filter Controls -->
            <div class="col-md-3 d-flex gap-2">
              <button type="button" class="btn btn-primary w-100 py-2 fw-semibold" id="btn-apply-report-filters" style="border-radius: 10px;">
                Apply
              </button>
              <button type="button" class="btn btn-light border w-100 py-2 fw-semibold" id="btn-reset-report-filters" style="border-radius: 10px;">
                Reset
              </button>
            </div>
          </div>
        </div>



        <!-- Details Registry Table -->
        <div class="table-responsive-custom">
          <table class="table table-custom align-middle bg-white">
            <thead>
              <tr>
                <th>Student ID</th>
                <th>Student Name</th>
                <th>Stream</th>
                <th>Total Classes</th>
                <th>Present</th>
                <th>Absent</th>
                <th>Pending</th>
                <th>Attendance %</th>
              </tr>
            </thead>
            <tbody id="report-table-body">
              <tr>
                <td colspan="8" class="text-center text-muted py-4">Please select a Course from the filters card above to display analytics.</td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </main>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Route guards and controllers -->
  <script type="module" src="../js/authGuard.js"></script>
  <script type="module" src="../js/reports.js"></script>
</body>
</html>
