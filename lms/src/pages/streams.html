<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Streams - LMS Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/table.css">
</head>
<body>

  <div class="admin-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="admin-main">
      <!-- Top Navbar -->
      <div id="header-container"></div>

      <!-- Page Content -->
      <div class="p-4 container-fluid">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
          <div>
            <h1 class="h3 fw-bold text-slate-800 mb-1">Academic Streams</h1>
            <p class="text-secondary small mb-0">Configure academic streams to classify students and courses.</p>
          </div>
          <div>
            <a href="./stream-create.html" class="btn btn-primary rounded-pill px-4 py-2 d-flex align-items-center gap-2">
              <i class="bi bi-folder-plus"></i> Add Stream
            </a>
          </div>
        </div>

        <!-- Filters and Controls Card -->
        <div class="card border-0 shadow-sm rounded-4 bg-white p-3 mb-4">
          <div class="d-flex justify-content-between align-items-center">
            <div class="search-box-custom w-100">
              <i class="bi bi-search search-icon"></i>
              <input type="text" class="form-control" id="streams-search-input" placeholder="Search by ID or stream name...">
            </div>
          </div>
        </div>

        <!-- Streams Table -->
        <div class="table-responsive-custom">
          <table class="table table-custom align-middle">
            <thead>
              <tr>
                <th style="width: 100px;">Stream ID</th>
                <th>Stream Name</th>
                <th style="width: 140px;">Actions</th>
              </tr>
            </thead>
            <tbody id="streams-table-body">
              <tr>
                <td colspan="4" class="text-center py-5 text-muted">
                  <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                  </div>
                  <div class="mt-2 small">Loading academic streams...</div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </main>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script triggers and guard filters -->
  <script type="module" src="../js/authGuard.js"></script>
  <script type="module" src="../js/stream.js"></script>
</body>
</html>
