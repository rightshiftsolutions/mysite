<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Details - LMS Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/teacher.css">
  <link rel="stylesheet" href="../css/student.css">
  <link rel="stylesheet" href="../css/game-details.css">
</head>
<body class="bg-light">

  <div id="main-container-class" class="teacher-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Workspace -->
    <main class="teacher-main" id="main-content-pane">
      <!-- Navbar Header -->
      <div id="header-container"></div>

      <!-- Page Content -->
      <div class="p-4 container-fluid">
        <div class="mb-4" id="back-link-wrapper">
          <!-- Populated dynamically -->
        </div>

        <!-- ========================================== -->
        <!-- TEACHER VIEW: METRICS SUMMARY -->
        <!-- ========================================== -->
        <div id="game-details-container" style="display: none;">
          <div class="text-center py-5 text-muted">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <div class="mt-2 small">Loading game details...</div>
          </div>
        </div>

        <!-- ========================================== -->
        <!-- STUDENT VIEW: PREVIEW & START -->
        <!-- ========================================== -->
        <div id="student-game-details-preview" style="display: none;">
          <div class="text-center py-5 text-muted">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <div class="mt-2 small">Loading game preview details...</div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Route guards and dynamic script controllers -->
  <script type="module" src="../js/authGuard.js"></script>
  
  <script type="module">
    import { storage } from '../js/storage.js';

    document.addEventListener('DOMContentLoaded', () => {
      const role = storage.getRole();
      const containerClass = document.getElementById('main-container-class');
      const contentPane = document.getElementById('main-content-pane');
      const backWrapper = document.getElementById('back-link-wrapper');

      if (role === 'teacher') {
        if (containerClass) containerClass.className = 'teacher-container';
        if (contentPane) contentPane.className = 'teacher-main';
        
        if (backWrapper) {
          backWrapper.innerHTML = `
            <a href="./games.html" class="text-secondary small fw-semibold text-decoration-none">
              <i class="bi bi-arrow-left"></i> Back to Console List
            </a>
          `;
        }
        
        document.getElementById('game-details-container').style.display = 'block';

        // Load controller
        import('../js/games.js');
      } else if (role === 'student') {
        if (containerClass) containerClass.className = 'student-container';
        if (contentPane) contentPane.className = 'student-main';

        if (backWrapper) {
          backWrapper.innerHTML = `
            <a href="./games.html" class="text-secondary small fw-semibold text-decoration-none">
              <i class="bi bi-arrow-left"></i> Back to Games List
            </a>
          `;
        }

        document.getElementById('student-game-details-preview').style.display = 'block';

        // Load controller
        import('../js/games.js');
      }
    });
  </script>
</body>
</html>
