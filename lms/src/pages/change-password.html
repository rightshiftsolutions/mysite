<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - LMS Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/teacher.css">
  <link rel="stylesheet" href="../css/profile.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

  <div class="teacher-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Workspace -->
    <main class="teacher-main">
      <!-- Navbar -->
      <div id="header-container"></div>

      <!-- Page Content -->
      <div class="p-4 container-fluid">
        <div class="mb-4">
          <a href="./teacher-profile.html" class="text-secondary small fw-semibold text-decoration-none">
            <i class="bi bi-arrow-left"></i> Back to Profile
          </a>
          <h1 class="h3 fw-bold text-slate-800 mt-2 mb-1">Change Password</h1>
          <p class="text-secondary small mb-0">Update your teacher portal password credentials.</p>
        </div>

        <div class="row">
          <div class="col-lg-8 mx-auto">
            <div class="card profile-form-card">
              <div class="profile-form-header">
                <h5 class="fw-bold mb-0 text-slate-800">Update Credentials</h5>
              </div>
              <div class="profile-form-body bg-white rounded-bottom-4">
                <form id="change-password-form" novalidate>
                  
                  <!-- Old Password -->
                  <div class="mb-3">
                    <label for="old-password" class="form-label fw-semibold">Current Password</label>
                    <div class="password-toggle-wrapper">
                      <input type="password" class="form-control form-input-custom pe-5" id="old-password" placeholder="Enter current password" required autocomplete="current-password">
                      <button type="button" class="password-toggle-btn" id="old-pass-toggle-btn" aria-label="Toggle Password Visibility">
                        <i class="bi bi-eye" id="old-pass-toggle-icon"></i>
                      </button>
                      <div class="invalid-feedback-custom">Current password is required.</div>
                    </div>
                  </div>

                  <!-- New Password -->
                  <div class="mb-3">
                    <label for="new-password" class="form-label fw-semibold">New Password</label>
                    <div class="password-toggle-wrapper">
                      <input type="password" class="form-control form-input-custom pe-5" id="new-password" placeholder="Minimum 8 characters" required autocomplete="new-password">
                      <button type="button" class="password-toggle-btn" id="new-pass-toggle-btn" aria-label="Toggle Password Visibility">
                        <i class="bi bi-eye" id="new-pass-toggle-icon"></i>
                      </button>
                      <div class="invalid-feedback-custom">Password must be at least 8 characters.</div>
                    </div>
                  </div>

                  <!-- Confirm Password -->
                  <div class="mb-4">
                    <label for="confirm-password" class="form-label fw-semibold">Confirm New Password</label>
                    <input type="password" class="form-control form-input-custom" id="confirm-password" placeholder="Repeat new password" required autocomplete="new-password">
                    <div class="invalid-feedback-custom">Passwords must match.</div>
                  </div>

                  <!-- Action Control -->
                  <div class="d-flex gap-2 justify-content-end">
                    <a href="./teacher-profile.html" class="btn btn-light rounded-3 px-4 border">Cancel</a>
                    <button type="submit" class="btn btn-submit-custom px-4" id="submit-btn">Update Password</button>
                  </div>

                </form>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Route guards, helpers, and password modifiers -->
  <script type="module" src="../js/authGuard.js"></script>
  <script type="module" src="../js/profile.js"></script>
  
  <script type="module">
    import { teacherHelpers } from '../js/teacher.js';
    document.addEventListener('DOMContentLoaded', () => {
      teacherHelpers.setupPasswordToggle('old-password', 'old-pass-toggle-btn', 'old-pass-toggle-icon');
      teacherHelpers.setupPasswordToggle('new-password', 'new-pass-toggle-btn', 'new-pass-toggle-icon');
    });
  </script>
</body>
</html>
