<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Admin - LMS Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/forms.css">
</head>
<body>

  <div class="admin-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="admin-main">
      <!-- Top Navbar -->
      <div id="header-container"></div>

      <!-- Page Content -->
      <div class="p-4 container-fluid">
        <div class="mb-4">
          <a href="./admin-list.html" class="text-secondary small fw-semibold text-decoration-none">
            <i class="bi bi-arrow-left"></i> Back to Admins List
          </a>
          <h1 class="h3 fw-bold text-slate-800 mt-2 mb-1">Create Admin Account</h1>
          <p class="text-secondary small mb-0">Register a new administrator console account.</p>
        </div>

        <div class="row">
          <div class="col-lg-8 mx-auto">
            <div class="card form-card-custom">
              <div class="form-card-header">
                <h5 class="fw-bold mb-0">New Credentials</h5>
              </div>
              <div class="form-card-body">
                <form id="admin-create-form" novalidate>
                  
                  <!-- Name Input -->
                  <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Name</label>
                    <input type="text" class="form-control form-input-custom" id="name" placeholder="Full name of administrator" required>
                    <div class="invalid-feedback-custom">Name is required.</div>
                  </div>

                  <!-- Email Input -->
                  <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <input type="email" class="form-control form-input-custom" id="email" placeholder="example@domain.com" required autocomplete="email">
                    <div class="invalid-feedback-custom">Please enter a valid email address.</div>
                  </div>

                  <!-- Password Input -->
                  <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" class="form-control form-input-custom" id="password" placeholder="Minimum 8 characters" required autocomplete="new-password">
                    <div class="invalid-feedback-custom">Password must be at least 8 characters.</div>
                  </div>

                  <!-- Role Select -->
                  <div class="mb-4">
                    <label for="role" class="form-label fw-semibold">Privileges Role</label>
                    <select class="form-select form-input-custom" id="role" required>
                      <option value="" disabled selected>Assign authorization role</option>
                      <option value="admin">Administrator</option>
                      <option value="superadmin">Super Administrator</option>
                    </select>
                    <div class="invalid-feedback-custom">Privileges role assignment is required.</div>
                  </div>

                  <!-- Form Control Buttons -->
                  <div class="d-flex gap-2 justify-content-end">
                    <a href="./admin-list.html" class="btn btn-light rounded-3 px-4 border">Cancel</a>
                    <button type="submit" class="btn btn-submit-custom px-4" id="submit-btn">Create Account</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script triggers and guard filters -->
  <script type="module" src="../js/authGuard.js"></script>
  <script type="module" src="../js/admin.js"></script>
</body>
</html>
