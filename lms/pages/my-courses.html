<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Courses - LMS Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/teacher.css">
  <link rel="stylesheet" href="../css/student.css">
  <link rel="stylesheet" href="../css/table.css">
  <link rel="stylesheet" href="../css/courses.css">
</head>
<body>

  <div id="main-container-class" class="teacher-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Workspace -->
    <main class="teacher-main" id="main-content-pane">
      <!-- Top Navbar Header -->
      <div id="header-container"></div>

      <!-- Page Content -->
      <div class="p-4 container-fluid">
        <!-- Header Text -->
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
          <div>
            <h1 class="h3 fw-bold text-slate-800 mb-1" id="courses-page-title">My Courses</h1>
            <p class="text-secondary small mb-0" id="courses-page-desc">Overview of your courses specifications.</p>
          </div>
          <!-- Teacher Actions Button -->
          <div id="teacher-create-btn-wrapper" style="display: none;">
            <a href="./create-course.html" class="btn btn-primary rounded-pill px-4 py-2 d-flex align-items-center gap-2">
              <i class="bi bi-journal-plus"></i> Create Course
            </a>
          </div>
        </div>

        <!-- ========================================== -->
        <!-- TEACHER VIEW: TABLE LAYOUT -->
        <!-- ========================================== -->
        <div id="teacher-courses-view" style="display: none;">
          <!-- Filter search box -->
          <div class="card border-0 shadow-sm rounded-4 bg-white p-3 mb-4">
            <div class="search-box-custom w-100">
              <i class="bi bi-search search-icon"></i>
              <input type="text" class="form-control" id="course-search-input" placeholder="Search by course name...">
            </div>
          </div>
          
          <div id="empty-state-container" style="display: none;"></div>

          <div class="table-responsive-custom" id="table-wrapper-container">
            <table class="table table-custom align-middle">
              <thead>
                <tr>
                  <th>Course Name</th>
                  <th>Timing Schedule</th>
                  <th>Assigned Streams</th>
                  <th style="width: 200px;">Actions</th>
                </tr>
              </thead>
              <tbody id="courses-table-body">
                <!-- Loaded dynamically via course.js -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- ========================================== -->
        <!-- STUDENT VIEW: CARDS LAYOUT -->
        <!-- ========================================== -->
        <div id="student-courses-view" style="display: none;">
          <div class="row g-4" id="student-courses-container">
            <div class="col-12 text-center py-5 text-muted">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <div class="mt-2 small">Loading your enrolled courses...</div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Route guards, storage checks, and conditional controllers loading -->
  <script type="module" src="../js/authGuard.js"></script>
  
  <script type="module">
    import { storage } from '../js/storage.js';
    
    document.addEventListener('DOMContentLoaded', () => {
      const role = storage.getRole();
      const containerClass = document.getElementById('main-container-class');
      const contentPane = document.getElementById('main-content-pane');
      
      const titleEl = document.getElementById('courses-page-title');
      const descEl = document.getElementById('courses-page-desc');

      if (role === 'teacher') {
        // Teacher Panel setup
        if (containerClass) containerClass.className = 'teacher-container';
        if (contentPane) contentPane.className = 'teacher-main';
        
        document.getElementById('teacher-create-btn-wrapper').style.display = 'block';
        document.getElementById('teacher-courses-view').style.display = 'block';

        if (titleEl) titleEl.textContent = 'Registered Courses';
        if (descEl) descEl.textContent = 'Create, modify, and assign streams to courses.';

        // Load teacher script dynamically
        import('../js/course.js');
      } else if (role === 'student') {
        // Student Panel setup
        if (containerClass) containerClass.className = 'student-container';
        if (contentPane) contentPane.className = 'student-main';

        document.getElementById('student-courses-view').style.display = 'block';

        if (titleEl) titleEl.textContent = 'My Course Enrollments';
        if (descEl) descEl.textContent = 'Review your enrolled courses and assigned educator profiles.';

        // Load student script dynamically
        import('../js/courses.js');
      }
    });
  </script>
</body>
</html>
