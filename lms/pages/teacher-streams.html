<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Streams - LMS Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/teacher.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/streams.css">
</head>
<body class="bg-light">

  <div class="teacher-container">
    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>

    <!-- Main Workspace -->
    <main class="teacher-main">
      <!-- Navbar Header -->
      <div id="header-container"></div>

      <!-- Page Content -->
      <div class="p-4 container-fluid" id="streams-content-area">
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading Layout...</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Route guards and pages controllers -->
  <script type="module" src="../js/authGuard.js"></script>
  
  <script type="module">
    import { storage } from '../js/storage.js';

    document.addEventListener('DOMContentLoaded', () => {
      const role = storage.getRole();
      const contentContainer = document.getElementById('streams-content-area');
      if (!contentContainer) return;

      if (role === 'admin') {
        // Adapt page container layout for Admin
        const wrapper = document.querySelector('.teacher-container');
        if (wrapper) {
          wrapper.className = 'admin-container';
        }
        const main = document.querySelector('.teacher-main');
        if (main) {
          main.className = 'admin-main';
        }
        document.title = "Teacher Assignments - LMS Portal";

        // Render Admin Layout
        contentContainer.innerHTML = `
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
              <h1 class="h3 fw-bold text-slate-800 mb-1">Teacher Stream Assignments</h1>
              <p class="text-secondary small mb-0">Monitor and view academic streams assigned to teachers.</p>
            </div>
            <div>
              <button class="btn btn-primary rounded-pill px-4 py-2 d-flex align-items-center gap-2" id="admin-assign-btn">
                <i class="bi bi-plus-circle-fill"></i> Assign Stream
              </button>
            </div>
          </div>

          <!-- Filters -->
          <div class="card border-0 shadow-sm rounded-4 bg-white p-3 mb-4">
            <div class="search-box-custom w-100">
              <i class="bi bi-search search-icon"></i>
              <input type="text" class="form-control" id="assignments-search-input" placeholder="Search by Teacher ID, name or stream...">
            </div>
          </div>

          <!-- Assignments Table -->
          <div class="table-responsive-custom">
            <table class="table table-custom align-middle">
              <thead>
                <tr>
                  <th>Teacher Name</th>
                  <th>Teacher ID</th>
                  <th>Assigned Stream</th>
                  <th>Status</th>
                  <th style="width: 200px;">Actions</th>
                </tr>
              </thead>
              <tbody id="teacher-streams-body">
                <tr>
                  <td colspan="5" class="text-center py-5 text-muted">
                    <div class="spinner-border text-primary" role="status">
                      <span class="visually-hidden">Loading...</span>
                    </div>
                    <div class="mt-2 small">Loading teacher stream assignments...</div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Assign Stream Modal -->
          <div class="modal fade" id="assignStreamModal" tabindex="-1" aria-labelledby="assignStreamModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
              <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-bottom-0 pb-0">
                  <h5 class="modal-title fw-bold" id="assignStreamModalLabel">Assign Stream to Teacher</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body py-4">
                  <form id="admin-assign-form" novalidate>
                    <!-- Teacher Select -->
                    <div class="mb-3">
                      <label for="modal-teacher-select" class="form-label fw-semibold">Select Teacher</label>
                      <select class="form-select" id="modal-teacher-select" required>
                        <option value="" disabled selected>Loading teachers...</option>
                      </select>
                      <div class="invalid-feedback">Please select a teacher.</div>
                    </div>
                    <!-- Stream Select -->
                    <div class="mb-4">
                      <label for="modal-stream-select" class="form-label fw-semibold">Select Stream</label>
                      <select class="form-select" id="modal-stream-select" required>
                        <option value="" disabled selected>Loading streams...</option>
                      </select>
                      <div class="invalid-feedback">Please select a stream.</div>
                    </div>
                    <div class="d-flex gap-2 justify-content-end">
                      <button type="button" class="btn btn-light rounded-3 px-4 border" data-bs-dismiss="modal">Cancel</button>
                      <button type="submit" class="btn btn-primary px-4" id="modal-submit-btn" style="border: none; color: white;">Assign Stream</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        `;

        // Inject the admin controller
        const script = document.createElement('script');
        script.type = 'module';
        script.src = '../js/teacherStream.js';
        document.body.appendChild(script);
      } else {
        document.title = "My Streams - LMS Portal";

        // Render Teacher Layout
        contentContainer.innerHTML = `
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
              <h1 class="h3 fw-bold text-slate-800 mb-1">My Assigned Streams</h1>
              <p class="text-secondary small mb-0">Select and self-assign academic streams to teach courses.</p>
            </div>
            <div>
              <a href="./assign-stream.html" class="btn btn-primary rounded-pill px-4 py-2 d-flex align-items-center gap-2">
                <i class="bi bi-plus-circle-fill"></i> Assign New Stream
              </a>
            </div>
          </div>

          <!-- Stream Cards Row -->
          <div class="row g-4" id="teacher-streams-container">
            <div class="col-12 text-center py-5 text-muted">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <div class="mt-2 small">Loading your assigned streams...</div>
            </div>
          </div>
        `;

        // Inject the teacher controller
        const script = document.createElement('script');
        script.type = 'module';
        script.src = '../js/stream.js';
        document.body.appendChild(script);
      }
    });
  </script>
</body>
</html>
