<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login - LMS Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

  <!-- Navbar -->
  <div id="navbar-container"></div>

  <!-- Auth Layout -->
  <main class="auth-wrapper">
    <div class="card auth-card shadow-premium slide-up">
      <div class="card-body p-4 rounded-inputs">
        
        <div class="auth-header">
          <img src="../assets/logo.png" alt="LMS Logo" class="auth-logo" onerror="this.src='https://placehold.co/120x120?text=LMS'">
          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">Log in to your student or teacher account</p>
        </div>

        <!-- Alert Container -->
        <div id="alert-container"></div>

        <form id="login-form" novalidate>
          <!-- Email / Mobile Input -->
          <div class="mb-3">
            <label for="login-id" class="form-label fw-semibold">Email or Mobile Number</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-secondary"></i></span>
              <input type="text" class="form-control border-start-0" id="login-id" placeholder="Enter your email or mobile" required autocomplete="username">
              <div class="invalid-feedback">Please enter a valid email or mobile number.</div>
            </div>
          </div>

          <!-- Password Input -->
          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="password-toggle-wrapper">
              <input type="password" class="form-control pe-5" id="password" placeholder="Enter your password" required autocomplete="current-password">
              <button type="button" class="password-toggle-btn" id="password-toggle-btn" aria-label="Toggle Password Visibility">
                <i class="bi bi-eye" id="password-toggle-icon"></i>
              </button>
              <div class="invalid-feedback">Password must be at least 8 characters.</div>
            </div>
          </div>

          <!-- Extra Controls -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="remember-me">
              <label class="form-check-label text-secondary small" for="remember-me">Remember me</label>
            </div>
            <a href="forgot-password.html" class="text-primary small fw-semibold text-decoration-none">Forgot Password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary-custom w-100 py-2.5 fw-semibold mb-3" id="submit-btn">
            Sign In
          </button>
        </form>

        <hr class="text-slate-300">

        <!-- Redirect options -->
        <div class="text-center">
          <p class="text-secondary small mb-1">Don't have an account?</p>
          <div class="d-flex justify-content-center gap-3">
            <a href="student-register.html" class="text-primary fw-semibold small text-decoration-none"><i class="bi bi-mortarboard me-1"></i>Register as Student</a>
            <span class="text-muted">|</span>
            <a href="teacher-register.html" class="text-primary fw-semibold small text-decoration-none"><i class="bi bi-briefcase me-1"></i>Register as Teacher</a>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Initialization and Form Submission Module -->
  <script type="module">
    import { renderNavbar } from '../components/navbar.js';
    import { handleUserLogin, setupPasswordToggle } from '../js/auth.js';

    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('navbar-container');
      setupPasswordToggle('password', 'password-toggle-btn', 'password-toggle-icon');
      
      const loginForm = document.getElementById('login-form');
      loginForm.addEventListener('submit', handleUserLogin);
    });
  </script>
</body>
</html>
