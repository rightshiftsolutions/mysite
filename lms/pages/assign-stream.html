<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assign Stream - LMS Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/teacher.css">
  <link rel="stylesheet" href="../css/forms.css">
</head>
<body>

  <div class="teacher-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Workspace -->
    <main class="teacher-main">
      <!-- Navbar -->
      <div id="header-container"></div>

      <!-- Page Content -->
      <div class="p-4 container-fluid">
        <div class="mb-4">
          <a href="./teacher-streams.html" class="text-secondary small fw-semibold text-decoration-none">
            <i class="bi bi-arrow-left"></i> Back to Stream Cards
          </a>
          <h1 class="h3 fw-bold text-slate-800 mt-2 mb-1">Assign Stream</h1>
          <p class="text-secondary small mb-0">Self-assign an academic stream to manage courses.</p>
        </div>

        <div class="row">
          <div class="col-lg-8 mx-auto">
            <div class="card form-card-custom">
              <div class="form-card-header">
                <h5 class="fw-bold mb-0 text-slate-800">Stream Assignment Details</h5>
              </div>
              <div class="form-card-body bg-white rounded-bottom-4">
                <form id="assign-stream-form" novalidate>
                  
                  <!-- Teacher Select -->
                  <div class="mb-3">
                    <label for="teacher-id" class="form-label fw-semibold">Educator Profile</label>
                    <select class="form-select form-input-custom" id="teacher-id" required>
                      <option value="" disabled selected>Loading profile details...</option>
                    </select>
                    <div class="invalid-feedback-custom">Educator select is required.</div>
                  </div>

                  <!-- Stream Select -->
                  <div class="mb-4">
                    <label for="stream-id" class="form-label fw-semibold">Academic Stream</label>
                    <select class="form-select form-input-custom" id="stream-id" required>
                      <option value="" disabled selected>Select stream to assign</option>
                      <option value="1">Science</option>
                      <option value="2">Commerce</option>
                      <option value="3">Arts</option>
                    </select>
                    <div class="invalid-feedback-custom">Please select an academic stream.</div>
                  </div>

                  <!-- Action Buttons -->
                  <div class="d-flex gap-2 justify-content-end">
                    <a href="./teacher-streams.html" class="btn btn-light rounded-3 px-4 border">Cancel</a>
                    <button type="submit" class="btn btn-submit-custom px-4" id="submit-btn">Assign Stream</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Route guards and profiles controllers -->
  <script type="module" src="../js/authGuard.js"></script>
  <script type="module" src="../js/stream.js"></script>
</body>
</html>
