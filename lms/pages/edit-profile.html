<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile - LMS Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/teacher.css">
  <link rel="stylesheet" href="../css/profile.css">
  <link rel="stylesheet" href="../css/forms.css">
</head>
<body>

  <div class="teacher-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Workspace -->
    <main class="teacher-main">
      <!-- Top Navbar -->
      <div id="header-container"></div>

      <!-- Page Content -->
      <div class="p-4 container-fluid">
        <div class="mb-4">
          <a href="./teacher-profile.html" class="text-secondary small fw-semibold text-decoration-none">
            <i class="bi bi-arrow-left"></i> Back to Profile
          </a>
          <h1 class="h3 fw-bold text-slate-800 mt-2 mb-1">Edit Profile</h1>
          <p class="text-secondary small mb-0">Modify your teacher account details and assign academic streams.</p>
        </div>

        <div class="row">
          <div class="col-lg-8 mx-auto">
            <div class="card profile-form-card">
              <div class="profile-form-header">
                <h5 class="fw-bold mb-0 text-slate-800">Account Specifications</h5>
              </div>
              <div class="profile-form-body bg-white rounded-bottom-4">
                <form id="teacher-edit-form" novalidate>
                  
                  <!-- Full Name -->
                  <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Full Name</label>
                    <input type="text" class="form-control form-input-custom" id="name" placeholder="Enter your full name" required>
                    <div class="invalid-feedback-custom">Name is required.</div>
                  </div>

                  <!-- Email Address -->
                  <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <input type="email" class="form-control form-input-custom" id="email" required autocomplete="email">
                    <div class="invalid-feedback-custom">Please enter a valid email address.</div>
                  </div>

                  <!-- Mobile Number -->
                  <div class="mb-3">
                    <label for="mobile" class="form-label fw-semibold">Mobile Number</label>
                    <input type="tel" class="form-control form-input-custom" id="mobile" placeholder="10-digit mobile number" required>
                    <div class="invalid-feedback-custom">Mobile number must be exactly 10 digits.</div>
                  </div>

                  <!-- Stream Selection -->
                  <div class="mb-3">
                    <label for="stream-id" class="form-label fw-semibold">Primary Assigned Stream</label>
                    <select class="form-select form-input-custom" id="stream-id">
                      <option value="" disabled selected>Select Stream</option>
                      <option value="1">Science</option>
                      <option value="2">Commerce</option>
                      <option value="3">Arts</option>
                    </select>
                    <div class="text-muted small mt-1">If your assigned streams are empty, modify assignments under sidebar options.</div>
                  </div>

                  <!-- Course Selection -->
                  <div class="mb-4">
                    <label for="course-id" class="form-label fw-semibold">Primary Teaching Course</label>
                    <select class="form-select form-input-custom" id="course-id">
                      <option value="" disabled selected>Select Main Course</option>
                      <!-- Dynamically loaded -->
                    </select>
                  </div>

                  <!-- Action Buttons -->
                  <div class="d-flex gap-2 justify-content-end">
                    <a href="./teacher-profile.html" class="btn btn-light rounded-3 px-4 border">Cancel</a>
                    <button type="submit" class="btn btn-submit-custom px-4" id="submit-btn">Save Changes</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Route guards and profile update triggers -->
  <script type="module" src="../js/authGuard.js"></script>
  <script type="module" src="../js/profile.js"></script>
</body>
</html>
