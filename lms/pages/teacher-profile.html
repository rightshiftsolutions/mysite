<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Profile - LMS Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/teacher.css">
  <link rel="stylesheet" href="../css/profile.css">
</head>
<body>

  <div class="teacher-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content Area -->
    <main class="teacher-main">
      <!-- Header top bar -->
      <div id="header-container"></div>

      <!-- Page Content -->
      <div class="p-4 container-fluid">
        <div class="mb-4">
          <h1 class="h3 fw-bold text-slate-800 mb-1">My Profile</h1>
          <p class="text-secondary small mb-0">Review your teacher account details and stream configuration records.</p>
        </div>

        <div class="row">
          <div class="col-lg-8 mx-auto">
            <!-- Profile Card -->
            <div class="card border-0 shadow-sm rounded-4 bg-white p-4" id="teacher-profile-card">
              <div class="text-center py-5 text-muted">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
                <div class="mt-2 small">Loading teacher details...</div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Route guards and profiles controllers -->
  <script type="module" src="../js/authGuard.js"></script>
  <script type="module" src="../js/profile.js"></script>
</body>
</html>
