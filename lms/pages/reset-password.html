<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose New Password - LMS Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

  <!-- Navbar -->
  <div id="navbar-container"></div>

  <!-- Auth Layout -->
  <main class="auth-wrapper">
    <div class="card auth-card shadow-premium slide-up">
      <div class="card-body p-4 rounded-inputs">
        
        <div class="auth-header">
          <img src="../assets/logo.png" alt="LMS Logo" class="auth-logo" onerror="this.src='https://placehold.co/120x120?text=LMS'">
          <h1 class="auth-title">New Password</h1>
          <p class="auth-subtitle">Type in your new secure password below</p>
        </div>

        <!-- Alert Container -->
        <div id="alert-container"></div>

        <form id="reset-password-form" novalidate>
          
          <!-- Email Address Input -->
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-secondary"></i></span>
              <input type="email" class="form-control border-start-0" id="email" placeholder="name@example.com" required readonly autocomplete="email">
            </div>
          </div>

          <!-- OTP Code Input -->
          <div class="mb-3">
            <label for="reset-otp" class="form-label fw-semibold">6-Digit OTP Code</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-lock text-secondary"></i></span>
              <input type="text" class="form-control border-start-0" id="reset-otp" placeholder="Enter 6-digit OTP" required maxlength="6" pattern="\d{6}">
              <div class="invalid-feedback">Please enter a valid 6-digit OTP code.</div>
            </div>
          </div>

          <!-- New Password Input -->
          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">New Password</label>
            <div class="password-toggle-wrapper">
              <input type="password" class="form-control pe-5" id="password" placeholder="Minimum 8 characters" required autocomplete="new-password">
              <button type="button" class="password-toggle-btn" id="password-toggle-btn" aria-label="Toggle Password Visibility">
                <i class="bi bi-eye" id="password-toggle-icon"></i>
              </button>
              <div class="invalid-feedback">Password must be at least 8 characters.</div>
            </div>
          </div>

          <!-- Confirm New Password Input -->
          <div class="mb-4">
            <label for="confirm-password" class="form-label fw-semibold">Confirm Password</label>
            <input type="password" class="form-control" id="confirm-password" placeholder="Confirm new password" required autocomplete="new-password">
            <div class="invalid-feedback">Passwords must match.</div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary-custom w-100 py-2.5 fw-semibold mb-3" id="submit-btn">
            Reset Password
          </button>
        </form>

        <hr class="text-slate-300">

        <!-- Login option -->
        <div class="text-center">
          <a href="login.html" class="text-secondary small fw-semibold text-decoration-none">Back to Login Page</a>
        </div>

      </div>
    </div>
  </main>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Initialization and Form Submission Module -->
  <script type="module">
    import { renderNavbar } from '../components/navbar.js';
    import { handleResetPassword, setupPasswordToggle } from '../js/auth.js';

    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('navbar-container');
      setupPasswordToggle('password', 'password-toggle-btn', 'password-toggle-icon');

      // Extract email from URL search parameters
      const urlParams = new URLSearchParams(window.location.search);
      const email = urlParams.get('email');
      
      const emailInput = document.getElementById('email');

      if (email) {
        emailInput.value = email;
      } else {
        // If email is missing, allow user to type it in (remove readonly attribute)
        emailInput.removeAttribute('readonly');
      }
      
      const resetForm = document.getElementById('reset-password-form');
      resetForm.addEventListener('submit', handleResetPassword);
    });
  </script>
</body>
</html>
