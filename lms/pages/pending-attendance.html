<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pending Approvals - LMS Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/teacher.css">
  <link rel="stylesheet" href="../css/table.css">
  <link rel="stylesheet" href="../css/attendance.css">
</head>
<body>

  <div class="teacher-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Workspace -->
    <main class="teacher-main">
      <!-- Navbar Header -->
      <div id="header-container"></div>

      <!-- Page Content -->
      <div class="p-4 container-fluid">
        <div class="mb-4">
          <h1 class="h3 fw-bold text-slate-800 mb-1">Pending Attendances</h1>
          <p class="text-secondary small mb-0">Approve or reject student attendance check-in request submissions.</p>
        </div>

        <!-- Empty State block -->
        <div id="empty-state-container" style="display: none;"></div>

        <!-- Responsive Table Container -->
        <div class="table-responsive-custom" id="table-wrapper-container">
          <table class="table table-custom align-middle">
            <thead>
              <tr>
                <th>Student ID</th>
                <th>Student Name</th>
                <th>Course Name</th>
                <th>Stream Name</th>
                <th style="width: 260px;">Actions</th>
              </tr>
            </thead>
            <tbody id="pending-table-body">
              <tr>
                <td colspan="5" class="text-center py-5 text-muted">
                  <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                  </div>
                  <div class="mt-2 small">Loading pending registry...</div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </main>
  </div>

  <!-- Mark Attendance Bootstrap Modal Dialog -->
  <div class="modal fade" id="mark-attendance-modal" tabindex="-1" aria-labelledby="markModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold" id="markModalLabel">Verify Check-In Request</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body py-4">
          <div class="attendance-modal-info mb-4">
            <div class="text-muted small">STUDENT NAME</div>
            <div class="fw-bold text-dark fs-5" id="modal-student-name">Student Name</div>
          </div>

          <form id="mark-attendance-form" novalidate>
            <!-- Status Dropdown -->
            <div class="mb-3">
              <label for="modal-attendance-status" class="form-label fw-semibold text-secondary">Attendance Status</label>
              <select class="form-select form-input-custom" id="modal-attendance-status" required>
                <option value="present">Present</option>
                <option value="absent">Absent</option>
              </select>
            </div>

            <!-- Remarks Textarea -->
            <div class="mb-3">
              <label for="modal-remark" class="form-label fw-semibold text-secondary">Remark Note</label>
              <textarea class="form-control form-input-custom" id="modal-remark" rows="3" placeholder="Enter reason, timing notes, or remark..."></textarea>
            </div>

            <!-- Action controls -->
            <div class="d-flex gap-2 justify-content-end pt-2">
              <button type="button" class="btn btn-light rounded-pill px-4 border" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary rounded-pill px-4" id="modal-submit-btn">Verify Status</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Route guards and controllers -->
  <script type="module" src="../js/authGuard.js"></script>
  <script type="module" src="../js/attendance.js"></script>
</body>
</html>
