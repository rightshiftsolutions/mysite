<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - LMS Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

  <!-- Navbar -->
  <div id="navbar-container"></div>

  <!-- Auth Layout -->
  <main class="auth-wrapper">
    <div class="card auth-card shadow-premium slide-up">
      <div class="card-body p-4 rounded-inputs">
        
        <div class="auth-header">
          <img src="../assets/logo.png" alt="LMS Logo" class="auth-logo" onerror="this.src='https://placehold.co/120x120?text=LMS'">
          <h1 class="auth-title">Reset Password</h1>
          <p class="auth-subtitle">Provide your account's email address and we'll send a link to restore access</p>
        </div>

        <!-- Alert Container -->
        <div id="alert-container"></div>

        <form id="forgot-password-form" novalidate>
          <!-- Email Input -->
          <div class="mb-4">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope-open text-secondary"></i></span>
              <input type="email" class="form-control border-start-0" id="email" placeholder="name@example.com" required autocomplete="email">
              <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary-custom w-100 py-2.5 fw-semibold mb-3" id="submit-btn">
            Send Reset Instructions
          </button>
        </form>

        <hr class="text-slate-300">

        <!-- Back link -->
        <div class="text-center">
          <a href="login.html" class="text-secondary small fw-semibold text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to Sign In</a>
        </div>

      </div>
    </div>
  </main>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Initialization and Form Submission Module -->
  <script type="module">
    import { renderNavbar } from '../components/navbar.js';
    import { handleForgotPassword } from '../js/auth.js';

    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('navbar-container');
      
      const forgotForm = document.getElementById('forgot-password-form');
      forgotForm.addEventListener('submit', handleForgotPassword);
    });
  </script>
</body>
</html>
