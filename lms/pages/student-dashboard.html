<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - LMS Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/button-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/student.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/table.css">
  <link rel="stylesheet" href="../css/attendance.css">
</head>
<body>

  <div class="student-container">
    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>

    <!-- Main Workspace -->
    <main class="student-main">
      <!-- Navbar Header -->
      <div id="header-container"></div>

      <!-- Page Content -->
      <div class="p-3 p-lg-4 container-fluid dash-fit">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
          <div>
            <h1 class="h3 fw-bold text-slate-800 mb-1">Student Portal</h1>
            <p class="text-secondary small mb-0">Check in, play active games, and track your rank — all in one place.</p>
          </div>
          <div id="current-date" class="text-secondary small fw-medium">
            <i class="bi bi-calendar3 me-2"></i>Loading date...
          </div>
        </div>

        <!-- Metrics Grid -->
        <div class="row g-3 mb-3">
          <!-- Mapped Courses -->
          <div class="col-md-4 col-sm-6">
            <a href="./my-courses.html" class="student-nav-btn h-100">
              <div>
                <div class="text-muted small fw-semibold text-uppercase mb-1" style="font-size: 0.75rem;">My Enrolled Courses</div>
                <div class="fs-3 fw-bold text-success" id="stat-student-courses">0</div>
              </div>
              <div class="stat-icon text-success" style="background-color: rgba(25, 135, 84, 0.1); width: 48px; height: 48px; min-width: 48px;">
                <i class="bi bi-journal-bookmark-fill" style="font-size: 1.3rem;"></i>
              </div>
            </a>
          </div>

          <!-- Today's Check-outs -->
          <div class="col-md-4 col-sm-6">
            <a href="./attendance-history.html" class="student-nav-btn h-100">
              <div>
                <div class="text-muted small fw-semibold text-uppercase mb-1" style="font-size: 0.75rem;">Today's Check-outs</div>
                <div class="fs-3 fw-bold text-info" id="stat-student-attendance">0</div>
              </div>
              <div class="stat-icon text-info" style="background-color: rgba(13, 202, 240, 0.1); width: 48px; height: 48px; min-width: 48px;">
                <i class="bi bi-calendar-check" style="font-size: 1.3rem;"></i>
              </div>
            </a>
          </div>

          <!-- Quick access to Classroom Games -->
          <div class="col-md-4 col-sm-12">
            <a href="./games.html" class="student-nav-btn h-100">
              <div>
                <div class="text-muted small fw-semibold text-uppercase mb-1" style="font-size: 0.75rem;">Active Games</div>
                <div class="fs-3 fw-bold text-warning" id="stat-student-games">0</div>
              </div>
              <div class="stat-icon text-warning" style="background-color: rgba(255, 193, 7, 0.1); width: 48px; height: 48px; min-width: 48px;">
                <i class="bi bi-controller" style="font-size: 1.3rem;"></i>
              </div>
            </a>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <!-- Mark Attendance (embedded directly on dashboard) -->
          <div class="col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 bg-white p-4 h-100 dash-card">
              <h3 class="h6 fw-bold mb-3 d-flex align-items-center gap-2">
                <i class="bi bi-geo-alt-fill text-primary"></i> Mark Attendance
              </h3>

              <div id="success-animation-container" style="display: none;"></div>

              <form id="mark-self-attendance-form" novalidate>
                <div id="active-class-container" class="mb-3">
                  <div class="text-center py-3 text-muted">
                    <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
                    <div>Checking active classrooms...</div>
                  </div>
                </div>
                <div class="d-grid" id="submit-btn-wrapper" style="display: none;">
                  <button type="submit" class="btn btn-submit-custom py-2 fw-semibold" id="submit-btn">
                    <i class="bi bi-geo-alt-fill me-1"></i>Mark Present
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- Active Games (only shown here on the dashboard — the standalone Games list has been removed) -->
          <div class="col-lg-7">
            <div class="card border-0 shadow-sm rounded-4 bg-white p-4 h-100 dash-card">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="h6 fw-bold mb-0 d-flex align-items-center gap-2">
                  <i class="bi bi-controller text-info"></i> Active Games
                </h3>
              </div>
              <div class="row g-3" id="dashboard-active-games">
                <div class="col-12 text-center py-4 text-muted small">
                  <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                  Loading active games...
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="row g-3">
          <!-- Mini Leaderboard -->
          <div class="col-12">
            <div class="card border-0 shadow-sm rounded-4 bg-white p-4 h-100 dash-card">
              <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <h3 class="h6 fw-bold mb-0 d-flex align-items-center gap-2">
                  <i class="bi bi-trophy-fill text-warning"></i> Leaderboard
                </h3>
                <div style="min-width: 200px;">
                  <select class="form-select form-select-sm rounded-pill px-3 py-1" id="dashboard-leaderboard-course-select" style="display: none;">
                    <option value="" disabled selected>Select Course</option>
                  </select>
                </div>
              </div>
              <ul class="list-group list-group-flush" id="dashboard-leaderboard-list">
                <li class="list-group-item py-3 px-0 border-0 text-center text-muted small">
                  <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                  Loading rankings...
                </li>
              </ul>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Route guards and controllers -->
  <script type="module" src="../js/authGuard.js"></script>
  <script type="module" src="../js/dashboard.js"></script>
  <script type="module" src="../js/attendance.js"></script>
</body>
</html>
