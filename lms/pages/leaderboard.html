<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - LMS Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/teacher.css">
  <link rel="stylesheet" href="../css/student.css">
  <link rel="stylesheet" href="../css/table.css">
  <link rel="stylesheet" href="../css/leaderboard.css">
  <link rel="stylesheet" href="../css/filters.css">
</head>
<body class="bg-light">

  <div id="main-container-class" class="teacher-container">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Workspace -->
    <main class="teacher-main" id="main-content-pane">
      <!-- Navbar Header -->
      <div id="header-container"></div>

      <!-- Page Content -->
      <div class="p-4 container-fluid">
        <div class="mb-4">
          <h1 class="h3 fw-bold text-slate-800 mb-1" id="leaderboard-title">Course Leaderboards</h1>
          <p class="text-secondary small mb-0" id="leaderboard-desc">Monitor scores, ranking stats, and achievements of students.</p>
        </div>

        <!-- Course Selector filter card -->
        <div class="filters-card-wrapper mb-4">
          <div class="row align-items-end">
            <div class="col-md-6 mx-auto text-center">
              <label class="form-label fw-bold text-secondary mb-2" style="font-size: 0.85rem;" id="leaderboard-select-label">SELECT CLASS COURSE</label>
              <select class="form-select form-input-custom mx-auto" id="leaderboard-course-select" style="max-width: 400px; border-radius: 12px;">
                <option value="" disabled selected>Select Course</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Podium Row -->
        <div class="row g-4 mb-4 justify-content-center">
          <!-- Rank 2: Silver (rendered left) -->
          <div class="col-md-4 order-md-1 order-2" id="podium-silver-card"></div>

          <!-- Rank 1: Gold (rendered center) -->
          <div class="col-md-4 order-md-2 order-1" id="podium-gold-card"></div>

          <!-- Rank 3: Bronze (rendered right) -->
          <div class="col-md-4 order-md-3 order-3" id="podium-bronze-card"></div>
        </div>

        <!-- Leaderboard Table list container -->
        <div class="table-responsive-custom" id="table-wrapper-container" style="display: none;">
          <h5 class="fw-bold text-slate-800 mb-3 border-bottom pb-2">Scores Rankings Log</h5>
          
          <table class="table table-custom align-middle bg-white">
            <thead>
              <tr>
                <th>Rank Position</th>
                <th>Student Name</th>
                <th>Student ID</th>
                <th>Calculated Score</th>
              </tr>
            </thead>
            <tbody id="leaderboard-table-body">
              <tr>
                <td colspan="4" class="text-center text-muted py-4">Please select a Course from the filters card above to display details.</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Leaderboard table pagination links -->
        <div class="d-flex justify-content-center mt-4">
          <nav aria-label="Leaderboard pagination navigation">
            <ul class="pagination pagination-sm" id="leaderboard-pagination-container"></ul>
          </nav>
        </div>

      </div>
    </main>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Route guards and controllers -->
  <script type="module" src="../js/authGuard.js"></script>
  <script type="module" src="../js/leaderboard.js"></script>
  
  <script type="module">
    import { storage } from '../js/storage.js';

    document.addEventListener('DOMContentLoaded', () => {
      const role = storage.getRole();
      const containerClass = document.getElementById('main-container-class');
      const contentPane = document.getElementById('main-content-pane');
      const titleEl = document.getElementById('leaderboard-title');
      const descEl = document.getElementById('leaderboard-desc');
      const labelEl = document.getElementById('leaderboard-select-label');

      if (role === 'teacher') {
        if (containerClass) containerClass.className = 'teacher-container';
        if (contentPane) contentPane.className = 'teacher-main';
        if (titleEl) titleEl.textContent = 'Educator Course Leaderboards';
        if (descEl) descEl.textContent = 'Monitor student rankings, game attempts scores, and classroom summaries.';
        if (labelEl) labelEl.textContent = 'CHOOSE MAPPED CLASS COURSE';
      } else if (role === 'student') {
        if (containerClass) containerClass.className = 'student-container';
        if (contentPane) contentPane.className = 'student-main';
        if (titleEl) titleEl.textContent = 'Class Leaderboard rankings';
        if (descEl) descEl.textContent = 'Compare your scores with top performers in enrolled courses.';
        if (labelEl) labelEl.textContent = 'CHOOSE ENROLLED CLASS COURSE';
      }
    });
  </script>
</body>
</html>
