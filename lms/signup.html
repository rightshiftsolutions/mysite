<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Signup - LMS Test Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="auth-bg">
  <main class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-8 col-lg-6">
        <div class="card card-soft">
          <div class="card-body p-4 p-lg-5">
            <h2 class="fw-bold mb-2">Student signup</h2>
            <p class="text-muted mb-4">Create your account and start playing tests.</p>
            <div id="authMessage"></div>
            <form id="signupForm">
              <div class="mb-3">
                <label class="form-label">Name</label>
                <input id="name" type="text" class="form-control form-control-lg" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input id="email" type="email" class="form-control form-control-lg" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Mobile</label>
                <input id="mobile" type="text" class="form-control form-control-lg">
              </div>
             
<div class="mb-3">
  <label class="form-label">Batch</label>
  <select id="batch" class="form-select form-select-lg" required>
    <option value="" disabled selected>— Select Batch —</option>
    <option value="2026">2026</option>
    <option value="2027">2027</option>
    <option value="2028">2028</option>
    <option value="2029">2029</option>
    <option value="2030">2030</option>
  </select>
</div>
<div class="mb-3">
  <label class="form-label">Branch</label>
  <input id="branch" type="text" class="form-control form-control-lg" required>
</div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input id="password" type="password" class="form-control form-control-lg" required>
              </div>
              <button type="submit" class="btn btn-primary btn-lg w-100">Create Student Account</button>
            </form>
            <div class="text-center mt-4">
              <span class="text-muted">Already registered?</span>
              <a href="login.html">Login</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
