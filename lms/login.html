<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, viewport-fit=cover">
  <title>Login - LMS Test Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
  <!-- ── PWA Meta Tags ── -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LMS Arena">
  <meta name="application-name" content="LMS Arena">
  <meta name="theme-color" content="#0d0f1c">
  <meta name="msapplication-TileColor" content="#0d0f1c">
  <meta name="format-detection" content="telephone=no">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, viewport-fit=cover">
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  <!-- Icons -->
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <!-- PWA Styles -->
  <link rel="stylesheet" href="/pwa.css">
</head>
<body class="auth-bg">
  <main class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-7 col-lg-5">
        <div class="card card-soft">
          <div class="card-body p-4 p-lg-5">
            <h2 class="fw-bold mb-2">Welcome back</h2>
            <p class="text-muted mb-4">Login as teacher or student.</p>
            <div id="authMessage"></div>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input id="email" type="email" class="form-control form-control-lg" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input id="password" type="password" class="form-control form-control-lg" required>
              </div>
              <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
            </form>
            <div class="text-center mt-4">
              <span class="text-muted">New student?</span>
              <a href="signup.html">Create account</a>
            </div>
          </div>
        </div>
        <div class="text-center mt-3">
          <a href="index.html" class="text-decoration-none">Back to home</a>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <!-- PWA Script -->
  <script src="/pwa.js"></script>
</body>
</html>
