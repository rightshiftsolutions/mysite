<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - LMS Test Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="auth-bg">
  <main class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-7 col-lg-5">
        <div class="card card-soft">
          <div class="card-body p-4 p-lg-5">
            <h2 class="fw-bold mb-2">Welcome back</h2>
            <p class="text-muted mb-4">Login as teacher or student.</p>
            <div id="authMessage"></div>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input id="email" type="email" class="form-control form-control-lg" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input id="password" type="password" class="form-control form-control-lg" required>
              </div>
              <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
            </form>
            <div class="text-center mt-4">
              <span class="text-muted">New student?</span>
              <a href="signup.html">Create account</a>
            </div>
          </div>
        </div>
        <div class="text-center mt-3">
          <a href="index.html" class="text-decoration-none">Back to home</a>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
