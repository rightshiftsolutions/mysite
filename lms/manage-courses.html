<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Courses – LMS Arena</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="teacher-bg">

  <!-- ── TOAST CONTAINER ── -->
  <div class="neon-toast-container" id="neonToastContainer"></div>

  <!-- ── NAVBAR ── -->
  <nav class="game-navbar">
    <div class="container d-flex align-items-center justify-content-between py-2">
      <a class="navbar-brand-game" href="teacher-dashboard.html">Command Center</a>
      <div class="d-flex align-items-center gap-2">
        <div class="d-none d-lg-flex gap-1">
          <a href="teacher-dashboard.html" class="nav-pill">Dashboard</a>
          <a href="create-game.html"       class="nav-pill">Create Game</a>
          <a href="manage-courses.html"    class="nav-pill active">Manage Courses</a>
          <a href="leaderboard.html"       class="nav-pill">Leaderboard</a>
        </div>
        <span class="small arena-text-muted d-none d-md-inline" data-current-user></span>
        <button class="btn-outline-game" onclick="logout()">Exit</button>
      </div>
    </div>
  </nav>

  <main class="container py-4 py-lg-5">

    <div id="courseMessage"></div>

    <!-- ── HERO ── -->
    <div class="dashboard-hero-section mb-5">
      <div style="position:relative;z-index:1;">
        <div class="teacher-page-badge mb-2">📚 Course Manager</div>
        <h1 class="teacher-page-title mb-1">Manage Courses</h1>
        <p class="arena-text-muted mb-0">Create and organize all learning modules for your students.</p>
      </div>
    </div>

    <!-- ── CREATE COURSE CARD ── -->
    <div class="glass-card p-4 mb-5">
      <h5 style="font-family:'Fredoka One',cursive;color:var(--text-primary);margin-bottom:1.4rem;">
        ➕ Create New Course
      </h5>
      <div class="row g-3 align-items-end">
        <div class="col-md-8">
          <label class="arena-label">Course Name</label>
          <input
            type="text"
            id="newCourseName"
            class="themed-form-control glow-focus"
            placeholder="e.g. Data Structures, Java Basics, Python Fundamentals"
          >
        </div>
        <div class="col-md-4">
          <button
            class="btn-game btn-game-primary w-100"
            style="padding:0.75rem 1.5rem;"
            onclick="createCourse()"
          >
            ➕ Add Course
          </button>
        </div>
      </div>
    </div>

    <!-- ── COURSES GRID ── -->
    <div>
      <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <h5 style="font-family:'Fredoka One',cursive;color:var(--text-primary);margin-bottom:0;">
          📋 All Courses
        </h5>
        <span class="teacher-page-badge" id="courseCountBadge">Loading…</span>
      </div>

      <div class="row g-3" id="coursesGrid">
        <div class="col-12 text-center py-5" style="color:var(--text-muted);">
          <div class="spinner-glow mx-auto mb-3"></div>
          Loading courses…
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/teacher.js"></script>
  <script>

    /* ── Override loadTeacherCourses to render card grid instead of table ── */
    async function loadTeacherCourses() {
      try {
        const courses = await apiRequest('/api/courses/');
        const grid    = document.getElementById('coursesGrid');
        const badge   = document.getElementById('courseCountBadge');

        if (!grid) return;

        if (badge) badge.textContent = `${courses.length} Course${courses.length !== 1 ? 's' : ''}`;

        if (!courses.length) {
          grid.innerHTML = `
            <div class="col-12 text-center py-5" style="color:var(--text-muted);">
              <div style="font-size:3.5rem;margin-bottom:1rem;">📭</div>
              <p style="font-family:'Fredoka One',cursive;font-size:1.15rem;color:var(--text-primary);">
                No courses yet
              </p>
              <p style="font-size:0.88rem;">Create your first course above to get started!</p>
            </div>`;
          return;
        }

        grid.innerHTML = courses.map((course, i) => `
          <div class="col-sm-6 col-lg-4">
            <div class="course-card" style="animation-delay:${i * 0.07}s;">
              <div class="d-flex justify-content-between align-items-start mb-3">
                <span class="teacher-page-badge">ID: ${course.course_id}</span>
                <button
                  class="teacher-action-btn"
                  style="background:rgba(255,68,85,0.12);border:1px solid rgba(255,68,85,0.3);
                         color:var(--neon-red);border-radius:3rem;padding:0.28rem 0.75rem;
                         font-family:'Fredoka One',cursive;font-size:0.82rem;cursor:pointer;
                         transition:all 0.2s;"
                  onmouseover="this.style.background='rgba(255,68,85,0.22)'"
                  onmouseout="this.style.background='rgba(255,68,85,0.12)'"
                  onclick="deleteCourse(${course.course_id})"
                >
                  🗑️ Delete
                </button>
              </div>
              <div class="course-card-name">${escapeHtml(course.course_name)}</div>
              <div class="course-card-meta mt-2">
                <span>📅 Active Course</span>
              </div>
            </div>
          </div>
        `).join('');

      } catch (err) {
        console.error(err);
        showAlert('courseMessage', err.message, 'danger');
      }
    }

    /* ── Override createCourse / deleteCourse to use neon toast ── */
    async function createCourse() {
      const course_name = document.getElementById('newCourseName').value.trim();
      if (!course_name) {
        showNeonToast('⚠️ Course name is required', 'warning');
        return;
      }
      try {
        await apiRequest('/api/courses/create-course', { method: 'POST', body: { course_name } });
        document.getElementById('newCourseName').value = '';
        showNeonToast('✅ Course created successfully!', 'success');
        await loadTeacherCourses();
      } catch (err) {
        showNeonToast('❌ ' + err.message, 'error');
      }
    }

    async function deleteCourse(courseId) {
      if (!confirm('Delete this course?')) return;
      try {
        await apiRequest(`/api/courses/${courseId}`, { method: 'DELETE' });
        showNeonToast('🗑️ Course deleted', 'success');
        await loadTeacherCourses();
      } catch (err) {
        showNeonToast('❌ ' + err.message, 'error');
      }
    }

    /* ── Init ── */
    document.addEventListener('DOMContentLoaded', () => {
      const user = requireAuth(['TEACHER']);
      if (!user) return;
      loadTeacherCourses();
    });
  </script>
</body>
</html>
