<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Arena – LMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
  <link href="assets/css/styles-additions.css" rel="stylesheet">
</head>
<body class="game-bg">

  <!-- ===== CONFETTI CANVAS (sits on top, pointer-events:none) ===== -->
  <canvas id="confettiCanvas"></canvas>

  <!-- ===== NAVBAR ===== -->
  <nav class="game-navbar">
    <div class="container d-flex align-items-center justify-content-between py-2">
      <a class="navbar-brand-game" href="student-dashboard.html">🎮 Dashboard</a>

      <div class="d-flex align-items-center gap-2">
        <!-- Mute toggle -->
        <button id="muteBtn" class="btn-icon-game" title="Toggle Sound" onclick="toggleMute()">🔊</button>

        <span id="gameTypeBadge" class="pill-badge">Game</span>
        <button class="btn-outline-game btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>


  <!-- Rapid Fire Sticky Timer — fixed position, outside any scroll container -->
  <div id="rfTimerWrap" class="rf-timer-wrap hidden">
    <div class="rf-timer-inner">
      <div class="rf-timer-pill" id="rfTimerPill">
        <span class="rf-timer-icon">⏱</span>
        <span id="rfTimerText">5:00</span>
      </div>
      <div class="rf-timer-bar-bg">
        <div id="rfTimerBarFill" class="rf-timer-bar-fill"></div>
      </div>
    </div>
  </div>

  <main class="container py-4 py-lg-5">

    <!-- Error -->
    <div id="gameError"></div>

    <!-- Header info -->
    <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3 mb-4">
      <div>
        <h1 id="gameTitle" class="game-title mb-1">Game</h1>
        <div id="gameCourse" class="game-subtitle"></div>
      </div>
      <div class="d-flex gap-2 align-items-center">
        <div class="timer-bubble" id="timerBox">--</div>
        <div class="counter-bubble" id="questionCounter">Ready</div>
      </div>
    </div>

    <!-- ===== INTRO SECTION ===== -->
    <section id="introSection">
      <div id="introCard"></div>
    </section>

    <!-- ===== PLAY SECTION ===== -->
    <section id="playSection" class="hidden">

      <!-- Stats HUD -->
      <div class="hud-bar mb-4">
        <div class="hud-item">
          <span class="hud-label">Mood</span>
          <span id="encouragementText" class="hud-value">Keep going!</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Progress</span>
          <div id="answeredPills" class="pills-row"></div>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="progress-track mb-4">
        <div id="progressBar" class="progress-fill" style="width:0%">
          <span id="progressText">0%</span>
        </div>
      </div>

      <!-- Question card -->
      <div id="questionHolder"></div>

      <!-- Action Buttons -->
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-4">
        <button id="prevButton" class="btn-game btn-game-ghost" onclick="previousQuestion()">← Prev</button>
        <div class="d-flex gap-2">
          <button id="nextButton" class="btn-game btn-game-primary" onclick="nextQuestion()">Skip →</button>
        </div>
      </div>

      <div id="millionaireGame" class="hidden text-center">

  <h2 id="millionaireQuestion" class="mb-4"></h2>

  <div id="millionaireOptions" class="row g-3"></div>

  <button id="lifeline5050" class="btn btn-warning mt-3">
    🎯 Use 50-50 Lifeline
  </button>

</div>

    </section>

    <!-- ===== RESULT SECTION ===== -->
    <section id="resultSection" class="hidden">
      <div id="resultCard"></div>
    </section>

  </main>

  <!-- Floating feedback toast -->
  <div id="feedbackToast" class="feedback-toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/game.js"></script>
</body>
</html>
