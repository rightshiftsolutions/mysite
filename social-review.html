<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rate Your Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#080c14;--surface:rgba(255,255,255,0.04);--surface-2:rgba(255,255,255,0.07);
    --border:rgba(255,255,255,0.08);--border-glow:rgba(99,179,237,0.3);
    --accent:#63b3ed;--accent-2:#9f7aea;--gold:#f6c90e;--gold-dim:rgba(246,201,14,0.18);
    --success:#48bb78;--danger:#fc8181;--text:#f0f4ff;
    --text-dim:rgba(240,244,255,0.45);--text-mid:rgba(240,244,255,0.7);
    --radius:20px;--radius-sm:12px;
    --insta-a:#f58529;--insta-b:#dd2a7b;--insta-c:#8134af;
    --wa-a:#25D366;--wa-b:#128C7E;
  }
  body.insta-theme{--accent:#dd2a7b;--accent-2:#f58529;--border-glow:rgba(221,42,123,0.3);}
  body.insta-theme::before{background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(221,42,123,0.14) 0%,transparent 70%),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(245,133,41,0.1) 0%,transparent 60%);}
  body.wa-theme{--accent:#25D366;--accent-2:#128C7E;--border-glow:rgba(37,211,102,0.3);}
  body.wa-theme::before{background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(37,211,102,0.12) 0%,transparent 70%),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(18,140,126,0.1) 0%,transparent 60%);}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;position:relative;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(99,179,237,0.12) 0%,transparent 70%),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(159,122,234,0.1) 0%,transparent 60%);pointer-events:none;z-index:0;}
  .noise{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");}
  .container{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 0 60px;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
  .header{width:100%;padding:36px 24px 28px;display:flex;flex-direction:column;align-items:center;gap:16px;animation:fadeDown 0.6s ease both;}
  .logo-wrap{width:80px;height:80px;border-radius:22px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 0 40px rgba(99,179,237,0.15),0 8px 32px rgba(0,0,0,0.4);backdrop-filter:blur(12px);position:relative;overflow:hidden;}
  .logo-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(99,179,237,0.12),transparent);}
  body.insta-theme .logo-wrap{box-shadow:0 0 40px rgba(221,42,123,0.2),0 8px 32px rgba(0,0,0,0.4);}
  body.insta-theme .logo-wrap::after{background:linear-gradient(135deg,rgba(221,42,123,0.15),transparent);}
  body.wa-theme .logo-wrap{box-shadow:0 0 40px rgba(37,211,102,0.2),0 8px 32px rgba(0,0,0,0.4);}
  body.wa-theme .logo-wrap::after{background:linear-gradient(135deg,rgba(37,211,102,0.15),transparent);}
  .gym-name{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:-0.3px;text-align:center;background:linear-gradient(135deg,#fff 40%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .greeting{font-size:13px;color:var(--text-dim);letter-spacing:0.5px;}
  .social-badge{display:none;align-items:center;gap:8px;border-radius:50px;padding:8px 16px;font-size:13px;font-weight:600;color:var(--text-mid);animation:fadeUp 0.5s 0.2s ease both;opacity:0;animation-fill-mode:both;}
  .social-badge.show{display:flex;}
  .badge-icon{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:800;}
  .card{width:calc(100% - 32px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 22px;backdrop-filter:blur(20px);box-shadow:0 4px 40px rgba(0,0,0,0.3);margin-bottom:14px;animation:fadeUp 0.5s ease both;}
  .card-label{font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
  .card-question{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;line-height:1.4;margin-bottom:20px;color:var(--text);}
  .stars{display:flex;gap:10px;justify-content:center;margin-bottom:4px;}
  .star{font-size:38px;cursor:pointer;transition:transform 0.18s cubic-bezier(.34,1.56,.64,1),filter 0.18s ease;filter:grayscale(1) brightness(0.5);user-select:none;}
  .star.active{filter:none;}.star:hover{transform:scale(1.15);}
  .star.pop{animation:starPop 0.3s cubic-bezier(.34,1.56,.64,1) both;}
  .star-hint{text-align:center;font-size:12px;color:var(--text-dim);min-height:18px;margin-top:6px;transition:opacity 0.2s;}
  .main-btns{width:calc(100% - 32px);display:flex;flex-direction:column;gap:12px;animation:fadeUp 0.6s 0.1s ease both;}
  .btn{width:100%;border:none;cursor:pointer;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;letter-spacing:0.3px;border-radius:var(--radius-sm);padding:18px 20px;position:relative;overflow:hidden;transition:transform 0.12s ease,box-shadow 0.15s ease;-webkit-appearance:none;}
  .btn:active{transform:scale(0.97);}
  .btn::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--rx,50%) var(--ry,50%),rgba(255,255,255,0.18) 0%,transparent 60%);opacity:0;transition:opacity 0.3s;pointer-events:none;}
  .btn.ripple::after{opacity:1;animation:rippleFade 0.5s ease forwards;}
  .btn-primary{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;box-shadow:0 4px 24px rgba(99,102,241,0.45),0 1px 0 rgba(255,255,255,0.12) inset;}
  .btn-primary:hover{box-shadow:0 6px 32px rgba(99,102,241,0.6);}
  .btn-insta-primary{background:linear-gradient(135deg,var(--insta-a),var(--insta-b),var(--insta-c));color:#fff;box-shadow:0 4px 24px rgba(221,42,123,0.45),0 1px 0 rgba(255,255,255,0.12) inset;}
  .btn-insta-primary:hover{box-shadow:0 6px 32px rgba(221,42,123,0.6);}
  .btn-wa-primary{background:linear-gradient(135deg,var(--wa-a),var(--wa-b));color:#fff;box-shadow:0 4px 24px rgba(37,211,102,0.4),0 1px 0 rgba(255,255,255,0.12) inset;}
  .btn-wa-primary:hover{box-shadow:0 6px 32px rgba(37,211,102,0.55);}
  .btn-ghost{background:var(--surface-2);border:1px solid var(--border);color:var(--text-mid);font-size:14px;font-weight:600;backdrop-filter:blur(8px);}
  .btn-ghost:hover{border-color:rgba(255,255,255,0.15);color:var(--text);}
  .btn-danger{background:rgba(252,129,129,0.08);border:1px solid rgba(252,129,129,0.2);color:var(--danger);font-size:14px;font-weight:600;backdrop-filter:blur(8px);}
  #step-rating{display:none;width:100%;flex-direction:column;align-items:center;padding:0 0 20px;gap:0;animation:fadeUp 0.4s ease both;}
  #step-copy{display:none;width:calc(100% - 32px);animation:fadeUp 0.4s ease both;}
  .review-box{background:var(--surface-2);border:1px solid var(--border-glow);border-radius:var(--radius-sm);padding:20px;font-size:15px;line-height:1.7;color:var(--text);margin-bottom:14px;}
  .review-box .review-line{display:block;}.review-box .review-line+.review-line{margin-top:6px;}
  .copy-badge{display:flex;align-items:center;gap:8px;background:rgba(72,187,120,0.12);border:1px solid rgba(72,187,120,0.3);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:14px;color:var(--success);font-weight:600;}
  .btn-success{background:linear-gradient(135deg,#38a169,#48bb78);color:#fff;box-shadow:0 4px 20px rgba(72,187,120,0.4);}
  .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,40,60,0.95);border:1px solid var(--border-glow);border-radius:50px;padding:12px 22px;font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;backdrop-filter:blur(16px);box-shadow:0 8px 32px rgba(0,0,0,0.4);z-index:1000;opacity:0;transition:opacity 0.3s ease,transform 0.3s ease;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .tick-anim{display:none;flex-direction:column;align-items:center;gap:8px;padding:12px 0 0;}
  .tick-circle{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#38a169,#68d391);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 0 30px rgba(72,187,120,0.5);animation:tickPop 0.4s cubic-bezier(.34,1.56,.64,1) both;}
  .overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(8,12,20,0.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;flex-direction:column;gap:14px;}
  .overlay.show{display:flex;}.overlay .spinner{width:48px;height:48px;border-width:4px;}
  .overlay-text{font-size:15px;color:var(--text-mid);}
  .btn:disabled{opacity:0.45;cursor:not-allowed;transform:none!important;}
  .done-state{text-align:center;padding:32px 16px;animation:fadeUp 0.4s ease both;}
  .done-state .done-icon{font-size:52px;margin-bottom:12px;}
  .done-state h3{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;margin-bottom:6px;}
  .done-state p{font-size:14px;color:var(--text-dim);}
  .section-gap{height:8px;}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
  @keyframes starPop{0%{transform:scale(1);}50%{transform:scale(1.35);}100%{transform:scale(1);}}
  @keyframes rippleFade{0%{opacity:1;}100%{opacity:0;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes tickPop{0%{transform:scale(0);opacity:0;}100%{transform:scale(1);opacity:1;}}
</style>
</head>
<body>
<div class="noise"></div>
<div class="overlay" id="overlay"><div class="spinner"></div><div class="overlay-text" id="overlay-text">Updating...</div></div>
<div class="toast" id="toast"></div>
<div class="container">
  <div class="header">
    <div class="logo-wrap" id="logoIcon">🏋️</div>
    <div class="gym-name" id="gymNameDisplay">Gym Name</div>
    <div class="greeting" id="greetingText">Hello, Member!</div>
    <div class="social-badge" id="instaBadge" style="background:linear-gradient(135deg,rgba(245,133,41,0.12),rgba(221,42,123,0.12),rgba(129,52,175,0.12));border:1px solid rgba(221,42,123,0.25);">
      <div class="badge-icon" style="background:linear-gradient(135deg,var(--insta-a),var(--insta-b),var(--insta-c));">IG</div>
      <span id="instaHandle">@handle</span>
    </div>
    <div class="social-badge" id="waBadge" style="background:linear-gradient(135deg,rgba(37,211,102,0.12),rgba(18,140,126,0.12));border:1px solid rgba(37,211,102,0.25);">
      <div class="badge-icon" style="background:linear-gradient(135deg,var(--wa-a),var(--wa-b));">WA</div>
      <span id="waGroupName">Group</span>
    </div>
  </div>
  <div class="main-btns" id="step-main">
    <button class="btn btn-primary" id="btnPrimary">⭐ PLEASE PROVIDE REVIEW</button>
    <button class="btn btn-ghost"   id="btnAlready">✅ I HAVE ALREADY GIVEN</button>
    <button class="btn btn-danger"  id="btnNotInterested">✕ NOT INTERESTED</button>
  </div>
  <div class="section-gap"></div>
  <div id="step-rating">
    <div class="card" id="card-gym-rating">
      <div class="card-label">Step 1 of 2</div>
      <div class="card-question" id="q1">How do you feel about the gym?</div>
      <div class="stars" id="stars-gym">
        <span class="star" data-val="1" onclick="setRating('gym',1)">⭐</span>
        <span class="star" data-val="2" onclick="setRating('gym',2)">⭐</span>
        <span class="star" data-val="3" onclick="setRating('gym',3)">⭐</span>
        <span class="star" data-val="4" onclick="setRating('gym',4)">⭐</span>
        <span class="star" data-val="5" onclick="setRating('gym',5)">⭐</span>
      </div>
      <div class="star-hint" id="hint-gym">Tap to rate</div>
    </div>
    <div class="card" id="card-trainer-rating" style="opacity:0.4;pointer-events:none;transition:opacity 0.3s">
      <div class="card-label">Step 2 of 2</div>
      <div class="card-question" id="q2">Rate your trainer</div>
      <div class="stars" id="stars-trainer">
        <span class="star" data-val="1" onclick="setRating('trainer',1)">⭐</span>
        <span class="star" data-val="2" onclick="setRating('trainer',2)">⭐</span>
        <span class="star" data-val="3" onclick="setRating('trainer',3)">⭐</span>
        <span class="star" data-val="4" onclick="setRating('trainer',4)">⭐</span>
        <span class="star" data-val="5" onclick="setRating('trainer',5)">⭐</span>
      </div>
      <div class="star-hint" id="hint-trainer">Tap to rate</div>
    </div>
  </div>
  <div id="step-copy">
    <div class="card">
      <div class="card-label">Your Review is Ready ✨</div>
      <div class="review-box"><span class="review-line" id="review-line1"></span><span class="review-line" id="review-line2"></span></div>
      <div class="copy-badge"><span>📋</span><span>Review copied! Just paste in Google</span></div>
      <div class="tick-anim" id="tick-anim" style="display:flex"><div class="tick-circle">✓</div></div>
    </div>
    <button class="btn btn-success" style="width:100%;margin:0 0 12px" onclick="openGoogleReview()">🌟 OPEN GOOGLE REVIEW &amp; PASTE</button>
  </div>
  <div id="step-done" style="display:none;width:100%">
    <div class="done-state">
      <div class="done-icon">🎉</div>
      <h3>Thank You!</h3>
      <p id="doneMsg">Your feedback means the world to us.</p>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
//  1. PARSE TOKEN — always first, before anything
// ══════════════════════════════════════════════
const urlParams = new URLSearchParams(window.location.search);

let gymId='0', memberId='0', socialType='google';
let gymName='FitZone Gym', trainerName='Trainer', memberName='Member';
let googlePlaceId='', instaUsername='', waGroupUrl='', waGroupName='our WhatsApp Group';

try {
  const raw = urlParams.get('token') || '';
  if (raw) {
    // UTF-8 safe base64 decode
    const decoded = decodeURIComponent(
      atob(raw).split('').map(c => '%' + ('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')
    );
    const tp = new URLSearchParams(decoded);
    gymId      = tp.get('gymId')      || '0';
    memberId   = tp.get('memberId')   || '0';
    socialType = (tp.get('type')      || 'google').toLowerCase();
    memberName = tp.get('memberName') || 'Member';
    gymName    = tp.get('gymName')    || 'FitZone Gym';

    if (socialType === 'google') {
      googlePlaceId = tp.get('googlePlaceId') || '';
      trainerName   = tp.get('trainerName')   || 'Trainer';
    }
    if (socialType === 'insta') {
      instaUsername = tp.get('instaUsername') || '';
    }
    if (socialType === 'whatsapp') {
      waGroupUrl  = tp.get('whatsappGroupUrl')  || '';
      waGroupName = tp.get('whatsappGroupName') || 'our WhatsApp Group';
    }
  }
} catch(e) { console.warn('Token parse error:', e); }

// Validate type
if (!['google','insta','whatsapp'].includes(socialType)) socialType = 'google';

const googleReviewUrl = googlePlaceId
  ? 'https://search.google.com/local/writereview?placeid=' + googlePlaceId
  : 'https://search.google.com/local/writereview';
const instaUrl = 'https://instagram.com/' + instaUsername;

// ══════════════════════════════════════════════
//  2. SOCIAL CONFIG
// ══════════════════════════════════════════════
const socialConfig = {
  google:   { btnPrimary:'⭐ PLEASE PROVIDE REVIEW',       btnAlready:'✅ I HAVE ALREADY GIVEN GOOGLE REVIEW', apiParam:'googleReview',    onPrimary:startGoogleReview, bodyClass:'' },
  insta:    { btnPrimary:'📸 PLEASE FOLLOW ON INSTAGRAM',  btnAlready:'✅ I HAVE ALREADY FOLLOWED',            apiParam:'instagramFollow', onPrimary:startInstaFollow,  bodyClass:'insta-theme' },
  whatsapp: { btnPrimary:'💬 PLEASE JOIN WHATSAPP GROUP',  btnAlready:'✅ I HAVE ALREADY JOINED',              apiParam:'whatsapp',        onPrimary:startWhatsappJoin, bodyClass:'wa-theme' },
};
const cfg = socialConfig[socialType];

// ══════════════════════════════════════════════
//  3. SESSION GUARD — keyed per type+gym+member
//     so different types never block each other
// ══════════════════════════════════════════════
const sessionKey = 'done_' + socialType + '_' + gymId + '_' + memberId;
if (sessionStorage.getItem(sessionKey) === '1') {
  document.getElementById('step-main').style.display  = 'none';
  document.getElementById('step-done').style.display  = 'block';
}

// ══════════════════════════════════════════════
//  4. INIT UI
// ══════════════════════════════════════════════
(function initUI() {
  if (cfg.bodyClass) document.body.classList.add(cfg.bodyClass);
  document.getElementById('gymNameDisplay').textContent = gymName;
  document.getElementById('greetingText').textContent   = 'Hello, ' + memberName + '! 👋';

  if (socialType === 'insta') {
    document.getElementById('instaHandle').textContent = '@' + instaUsername;
    document.getElementById('instaBadge').classList.add('show');
  }
  if (socialType === 'whatsapp') {
    document.getElementById('waGroupName').textContent = waGroupName;
    document.getElementById('waBadge').classList.add('show');
  }

  document.getElementById('btnPrimary').textContent = cfg.btnPrimary;
  document.getElementById('btnAlready').textContent = cfg.btnAlready;

  document.getElementById('btnPrimary').onclick       = function(e){ ripple(e); cfg.onPrimary(); };
  document.getElementById('btnAlready').onclick       = function(e){ statusUpdate(1, this); };
  document.getElementById('btnNotInterested').onclick = function(e){ statusUpdate(2, this); };

  if (socialType === 'insta')    document.getElementById('btnPrimary').classList.replace('btn-primary','btn-insta-primary');
  if (socialType === 'whatsapp') document.getElementById('btnPrimary').classList.replace('btn-primary','btn-wa-primary');

  if (socialType === 'google') {
    document.getElementById('q1').textContent = 'How do you feel about ' + gymName + ', ' + memberName + '?';
    document.getElementById('q2').textContent = memberName + ', rate trainer "' + trainerName + '" sir';
  }
})();

// ══════════════════════════════════════════════
//  GOOGLE FLOW
// ══════════════════════════════════════════════
let gymRating=0, trainerRating=0;
const starHints=['','Terrible 😞','Bad 😕','Okay 😐','Good 😊','Excellent 🔥'];

function startGoogleReview() {
  document.getElementById('step-main').style.display='none';
  var sr=document.getElementById('step-rating');
  sr.style.display='flex';
  setTimeout(function(){ sr.scrollIntoView({behavior:'smooth'}); },100);
}

function setRating(type,val) {
  if (type==='gym') {
    gymRating=val; updateStars('stars-gym',val);
    document.getElementById('hint-gym').textContent=starHints[val];
    var tc=document.getElementById('card-trainer-rating');
    tc.style.opacity='1'; tc.style.pointerEvents='auto';
    setTimeout(function(){ tc.scrollIntoView({behavior:'smooth',block:'center'}); },200);
  } else {
    trainerRating=val; updateStars('stars-trainer',val);
    document.getElementById('hint-trainer').textContent=starHints[val];
    if (gymRating>0) setTimeout(showCopyStep,600);
  }
}

function updateStars(id,val) {
  document.querySelectorAll('#'+id+' .star').forEach(function(s,i){
    s.classList.toggle('active',i<val);
    if (i===val-1){ s.classList.add('pop'); setTimeout(function(){ s.classList.remove('pop'); },350); }
  });
}

async function showCopyStep() {
  var r=getReview(gymRating,trainerRating);
  document.getElementById('review-line1').textContent=r[0];
  document.getElementById('review-line2').textContent=r[1];
  document.getElementById('step-rating').style.display='none';
  document.getElementById('step-copy').style.display='block';
  try { await navigator.clipboard.writeText(r[0]+'\n'+r[1]); }
  catch(e) {
    var ta=document.createElement('textarea'); ta.value=r[0]+'\n'+r[1];
    ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  }
  showToast('📋 Review copied to clipboard!');
  await callStatusApi(1);
}

function openGoogleReview() {
  ripple(event); event.currentTarget.disabled=true;
  sessionStorage.setItem(sessionKey,'1');
  window.open(googleReviewUrl,'_blank');
  document.getElementById('step-copy').style.display='none';
  document.getElementById('step-done').style.display='block';
}

// ══════════════════════════════════════════════
//  INSTAGRAM FLOW
// ══════════════════════════════════════════════
async function startInstaFollow() {
  window.open(instaUrl,'_blank');
  await callStatusApi(1);
  showDone();
}

// ══════════════════════════════════════════════
//  WHATSAPP FLOW

async function startWhatsappJoin() {
  if (waGroupUrl) window.open(waGroupUrl,'_blank');
  await callStatusApi(1);
  showDone();
}

async function statusUpdate(status,el) {
  if (el) ripple({currentTarget:el,clientX:0,clientY:0});
  document.querySelectorAll('.btn').forEach(function(b){ b.disabled=true; });
  await callStatusApi(status);
  showDone();
}

async function callStatusApi(status) {
  var overlay=document.getElementById('overlay');
  document.getElementById('overlay-text').textContent=status===1?'Saving your response...':'Updating status...';
  overlay.classList.add('show');
  try {
    var url='https://www.api.gymgurus.in/member/update-social-status?memberId='+memberId+'&gymId='+gymId+'&'+cfg.apiParam+'='+status;
    var res=await fetch(url,{method:'PUT'});
    if (!res.ok) throw new Error(res.status+': '+(await res.text()));
    if (status===1) showToast(socialType==='insta'?'✅ Thanks for following!':socialType==='whatsapp'?'✅ Thanks for joining!':'✅ Thank you for your review!');
    if (status===2) showToast('Noted! Maybe next time 😊');
  } catch(e) {
    showToast('⚠️ '+e.message);
    document.querySelectorAll('.btn').forEach(function(b){ b.disabled=false; });
  }
  overlay.classList.remove('show');
}

function showDone() {
  ['step-main','step-rating','step-copy'].forEach(function(id){ document.getElementById(id).style.display='none'; });
  document.getElementById('step-done').style.display='block';
  if (socialType==='insta')    document.getElementById('doneMsg').textContent='Thanks for following @'+instaUsername+'! 💪';
  if (socialType==='whatsapp') document.getElementById('doneMsg').textContent='Thanks for joining '+waGroupName+'! 💬';
}

  do { idx=Math.floor(Math.random()*pool.length); } while(idx===lastUsed[key]&&pool.length>1);

function showToast(msg,dur) {
  dur=dur||3000;
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); },dur);
}

function ripple(e) {
  if (!e||!e.currentTarget) return;
  var btn=e.currentTarget, rect=btn.getBoundingClientRect();
  var x=((e.clientX||rect.left+rect.width/2)-rect.left)/rect.width*100;
  var y=((e.clientY||rect.top+rect.height/2)-rect.top)/rect.height*100;
  btn.style.setProperty('--rx',x+'%'); btn.style.setProperty('--ry',y+'%');
  btn.classList.remove('ripple'); void btn.offsetWidth; btn.classList.add('ripple');
}

document.querySelectorAll('.btn').forEach(function(b){
  b.addEventListener('click',function(e){ ripple({currentTarget:b,clientX:e.clientX,clientY:e.clientY}); });
});
