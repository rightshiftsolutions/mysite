<!DOCTYPE html>
<html>
<head>
<title>Gym Shop</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050608">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/theme1.css">

<link rel="stylesheet" href="css/theme-runtime.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/site-config.js"></script>
</head>

<body class="shop-page">

<nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
    <div class="container">
        <a class="navbar-brand text-uppercase fw-bolder d-flex align-items-center" id="shopHomeLink" href="index.html">
            <div class="logo-icon bg-accent text-dark rounded-circle d-flex justify-content-center align-items-center me-2" style="width: 40px; height: 40px;">
                <i class="fas fa-dumbbell fs-5" style="transform: rotate(-45deg);"></i>
            </div>
            <span class="fs-4 tracking-wider">
                <span class="text-white" id="shopBrandWhite">26</span>
                <span class="text-light fw-light" id="shopBrandLight">fitness</span>
                <span class="text-accent" id="shopBrandAccent">Club</span>
            </span>
        </a>

        <div class="d-flex align-items-center gap-2 shop-nav-actions">
            <a class="shop-back-button shop-offer-link" id="shopOfferLink" href="index.html#offers" aria-label="View current offers">
                <span class="shop-offer-ping" aria-hidden="true"></span>
                <i class="fas fa-gift"></i>
                <span>Offers</span>
                <span class="shop-offer-badge" id="shopOfferBadge">Live</span>
            </a>
            <a class="shop-back-button" id="shopBackButton" href="index.html">
                <i class="fas fa-arrow-left me-2"></i><span id="shopBackLabel">Back</span>
            </a>

            <button class="btn btn-warning shop-cart-button" id="shopCartButton" type="button">
                <i class="fas fa-cart-shopping me-2 shop-cart-icon"></i>
                <span id="shopCartButtonLabel">Cart</span> (<span id="cartCount">0</span>)
            </button>
        </div>
    </div>
</nav>

<section class="shop-hero">
    <div class="container text-center">
        <div class="shop-badge" id="shopHeroBadge">Official Merchandise &amp; More</div>
        <h1 class="section-heading mt-3 mb-4">
            <span class="text-white" id="shopHeroTitleWhite">Gym</span>
            <span class="text-accent" id="shopHeroTitleAccent">Shop</span>
        </h1>
        <p class="section-subheading mb-0" id="shopHeroSubtitle">Apparel, shoes, supplements and accessories — all managed from shop.json.</p>
    </div>
</section>

<section class="container shop-products-section">
    <div class="shop-category-filter d-flex justify-content-center flex-wrap gap-3 mb-5" id="shopCategoryFilter"></div>
    <div class="row" id="productList"></div>
</section>

<div class="modal fade" id="cartModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content shop-modal-content">
            <div class="modal-header">
                <h5 id="cartModalTitle">Your Cart</h5>
            </div>

            <div class="modal-body" id="cartItems"></div>

            <div class="modal-body pt-0">
                <input class="form-control premium-input mb-2" id="cartUsername" placeholder="Name">
                <input class="form-control premium-input mb-0" id="cartPhone" placeholder="Phone Number">
            </div>

            <div class="modal-footer">
                <button class="btn btn-accent" id="placeOrderButton" type="button">Place Order</button>
            </div>
        </div>
    </div>
</div>

<footer class="mt-5 pt-4 pb-4 border-top border-secondary border-opacity-25 text-center text-muted small" style="background-color: #050505;">
    <div class="container">
        <span id="shopFooterCopyright">© 2026 26fitnessClub. All Rights Reserved.</span>
        <span id="shopFooterSeparator"> | </span>
        <span class="text-accent" id="shopFooterPoweredBy">Powered by RightShift Solutions</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/shop.js"></script>
    <script src="js/lead-widget.js"></script>
</body>
</html>
