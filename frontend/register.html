<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gym Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
        }

        .register-box {
            width: 500px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h3 {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
        }
    </style>

</head>

<body>

    <div class="register-box">
        <h3>Gym Register</h3>

        <form id="registerForm">

            <input class="form-control mb-2" type="text" id="name" placeholder="Gym Name" required>
            <input class="form-control mb-2" type="text" id="owner_name" placeholder="Owner Name" required>
            <input class="form-control mb-2" type="text" id="phone" placeholder="Phone" required>
            <input class="form-control mb-2" type="email" id="email" placeholder="Email" required>
            <input class="form-control mb-2" type="text" id="username" placeholder="Username" required>
            <input class="form-control mb-2" type="password" id="password" placeholder="Password" required>
            <input class="form-control mb-2" type="number" id="payment" placeholder="Payment" required>

            <label>Date of Joining</label>
            <input class="form-control mb-2" type="date" id="date_of_joining" required>

            <label>Last Payment Date</label>
            <input class="form-control mb-2" type="date" id="date_of_last_payment" required>

            <input class="form-control mb-2" type="text" id="status" value="active" readonly>
            <textarea class="form-control mb-3" id="address" placeholder="Address" required></textarea>

            <button type="submit" class="btn btn-primary">Register</button>

        </form>

        <div id="msg" class="mt-3 text-center"></div>

    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const data = {
                name: document.getElementById("name").value,
                owner_name: document.getElementById("owner_name").value,
                phone: document.getElementById("phone").value,
                email: document.getElementById("email").value,
                username: document.getElementById("username").value,
                password: document.getElementById("password").value,
                payment: Number(document.getElementById("payment").value),
                date_of_joining: document.getElementById("date_of_joining").value,
                date_of_last_payment: document.getElementById("date_of_last_payment").value,
                status: "active",
                address: document.getElementById("address").value
            };

            try {
                const res = await fetch("http://localhost:5000/gym/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                document.getElementById("msg").innerHTML =
                    `<span class="text-success">${result.message}</span>`;

            } catch (err) {
                document.getElementById("msg").innerHTML =
                    `<span class="text-danger">Error registering</span>`;
                console.error(err);
            }
        });
    </script>

</body>

</html>
