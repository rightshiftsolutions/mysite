<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Profile - FitAdmin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div id="global-loader" class="hidden">
        <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div class="wrapper">
                <nav class="sidebar">
            <div class="logo-container">
                <h3><i class="fas fa-dumbbell text-primary"></i> FitAdmin</h3>
            </div>
            <ul class="nav-menu">
                <li><a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="profile.html" class="nav-link active"><i class="fas fa-building"></i> Gym Profile</a></li>
                <li><a href="events.html" class="nav-link"><i class="fas fa-calendar-alt"></i> Events</a></li>
                <li><a href="pendingMembers.html" class="nav-link"><i class="fas fa-user-clock"></i> Pending</a></li>
                <li><a href="inactiveMembers.html" class="nav-link"><i class="fas fa-user-slash"></i> Inactive</a></li>
                <li><a href="plan.html" class="nav-link"><i class="fas fa-clipboard-list"></i> Plans</a></li>
            </ul>
        </nav>

        <div class="main-panel">
            <nav class="top-navbar">
                <div class="d-flex align-items-center">
                    <h4 class="m-0 fw-bold text-dark"><i class="fas fa-building me-2"></i>Gym Profile</h4>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2"
                            style="width: 35px; height: 35px;">
                            <i class="fas fa-user"></i>
                        </div>
                        <span class="fw-medium text-dark" id="gymNameDisplay">Admin</span>
                    </div>
                    <button class="btn btn-outline-danger btn-sm rounded-pill px-3" id="logoutBtn">
                        <i class="fas fa-sign-out-alt me-1"></i> Logout
                    </button>
                </div>
            </nav>

            <div class="content">
                <div class="form-container">
                    <h5 class="mb-4">Gym Information</h5>
                    <form id="profileForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-medium">Gym Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-building"></i></span>
                                    <input type="text" id="name" class="form-control" required placeholder="Loading...">
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-medium">Owner Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-user-tie"></i></span>
                                    <input type="text" id="owner_name" class="form-control" placeholder="Loading...">
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-medium">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="email" id="email" class="form-control" required
                                        placeholder="Loading...">
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-medium">Phone Number</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-phone"></i></span>
                                    <input type="text" id="phone" class="form-control" required
                                        placeholder="Loading...">
                                </div>
                            </div>
                            <div class="col-12 mb-4">
                                <label class="form-label fw-medium">Gym Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-map-marker-alt"></i></span>
                                    <textarea id="address" class="form-control" rows="2"
                                        placeholder="Loading..."></textarea>
                                </div>
                            </div>
                        </div>



                        <div class="d-flex justify-content-end mt-2">
                            <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save me-2"></i>Update
                                Profile</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script>
        checkAuth();

        async function loadProfile() {
            const res = await apiRequest("/gym/profile");

            if (res && res.status === 200) {
                const gym = res.data.gym || res.data;

                document.getElementById('name').value = gym.name || "";
                document.getElementById('owner_name').value = gym.owner_name || "";
                document.getElementById('email').value = gym.email || "";
                document.getElementById('phone').value = gym.phone || "";
                document.getElementById('address').value = gym.address || "";
                document.getElementById('gymNameDisplay').textContent = gym.name || "Admin";

                // Update local storage so the Top Navbar displays correct name app-wide
                localStorage.setItem("gym", JSON.stringify(gym));

                const statusBadge = document.getElementById('statusBadge');
                if (gym.status === 'active') {
                    statusBadge.className = 'badge bg-success p-2 px-3 rounded-pill fs-6';
                    statusBadge.textContent = 'Active & Verified';
                } else if (gym.status === 'pending') {
                    statusBadge.className = 'badge bg-warning text-dark p-2 px-3 rounded-pill fs-6';
                    statusBadge.textContent = 'Pending Approval';
                } else {
                    statusBadge.className = 'badge bg-danger p-2 px-3 rounded-pill fs-6';
                    statusBadge.textContent = 'Inactive';
                }
            } else {
                showAlert("Failed to load profile data", "danger");
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadProfile();

            document.getElementById('profileForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                const body = {
                    name: document.getElementById('name').value,
                    owner_name: document.getElementById('owner_name').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    address: document.getElementById('address').value
                };

                const res = await apiRequest("/gym/update", "PUT", body);

                if (res && (res.status === 200 || res.status === 201)) {
                    showAlert("Profile updated successfully!", "success");
                    document.getElementById('gymNameDisplay').textContent = body.name;

                    // Update cache
                    let cachedGym = JSON.parse(localStorage.getItem("gym") || "{}");
                    cachedGym = { ...cachedGym, ...body };
                    localStorage.setItem("gym", JSON.stringify(cachedGym));

                } else {
                    showAlert(res?.data?.message || "Failed to update profile", "danger");
                }
            });
        });
    </script>
</body>

</html>
