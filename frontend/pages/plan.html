<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Plans - Gym Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Loader -->
    <div id="global-loader" class="hidden">
        <div class="spinner-border text-primary"></div>
    </div>

    <div class="wrapper">

        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="logo-container">
                <h3><i class="fas fa-dumbbell text-primary"></i> FitAdmin</h3>
            </div>

            <ul class="nav-menu">
                <li><a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="profile.html" class="nav-link"><i class="fas fa-building"></i> Gym Profile</a></li>
                <li><a href="events.html" class="nav-link"><i class="fas fa-calendar-alt"></i> Events</a></li>
                <li><a href="pendingMembers.html" class="nav-link"><i class="fas fa-user-clock"></i> Pending</a></li>
                <li><a href="inactiveMembers.html" class="nav-link"><i class="fas fa-user-slash"></i> Inactive</a></li>
                <li><a href="plan.html" class="nav-link active"><i class="fas fa-clipboard-list"></i> Plans</a></li>
            </ul>
        </nav>

        <!-- Main Panel -->
        <div class="main-panel">

            <!-- Top Navbar -->
            <nav class="top-navbar">
                <h4 class="fw-bold text-dark">
                    <i class="fas fa-clipboard-list me-2"></i>Membership Plans
                </h4>

                <button class="btn btn-outline-danger btn-sm rounded-pill px-3" id="logoutBtn">
                    <i class="fas fa-sign-out-alt me-1"></i> Logout
                </button>
            </nav>

            <!-- Content -->
            <div class="content">
                <div class="row">

                    <!-- Create Plan -->
                    <div class="col-lg-4 mb-4">
                        <div class="dashboard-card">

                            <h5 class="fw-bold mb-4 border-bottom pb-2">
                                <i class="fas fa-plus-circle text-primary me-2"></i>Create Plan
                            </h5>

                            <form id="createPlanForm">

                                <div class="mb-3">
                                    <label class="form-label">Duration (Months)</label>
                                    <input type="number" id="planName" class="form-control" required
                                        placeholder="e.g. 3">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Price (₹)</label>
                                    <input type="number" id="planPrice" class="form-control" required
                                        placeholder="e.g. 1500">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Description</label>
                                    <textarea id="planDescription" class="form-control" rows="3"
                                        placeholder="Gym + Trainer + Diet"></textarea>
                                </div>

                                <button type="submit" class="btn btn-success w-100">
                                    <i class="fas fa-save me-1"></i>Create Plan
                                </button>

                            </form>
                        </div>
                    </div>

                    <!-- Plans List -->
                    <div class="col-lg-8 mb-4">
                        <div class="dashboard-card">

                            <h5 class="fw-bold mb-4 border-bottom pb-2">
                                <i class="fas fa-list text-primary me-2"></i>All Plans
                            </h5>

                            <div class="row" id="plansContainer">
                                <div class="text-center py-5">
                                    <div class="spinner-border text-primary"></div>
                                    <p class="text-muted mt-2">Loading plans...</p>
                                </div>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/script.js"></script>

    <script>

        checkAuth();

        // LOAD PLANS
        async function loadPlans() {
            const container = document.getElementById("plansContainer");

            const res = await apiRequest("/plan/getPlans");

            if (res && res.status === 200) {

                const plans = res.data.data || res.data;

                if (plans.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <i class="fas fa-box-open fs-1 text-muted"></i>
                            <p class="text-muted mt-2">No plans found</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = "";

                plans.forEach(p => {
                    const div = document.createElement("div");
                    div.className = "col-md-6 mb-3";

                    div.innerHTML = `
                        <div class="card shadow-sm border-0 h-100">

                            <div class="card-body">

                                <h5 class="fw-bold">${p.name}</h5>

                                <p class="mb-1 text-success fw-bold">
                                    ₹ ${p.price}
                                </p>

                                <p class="text-muted small">
                                    ${p.description || "No description"}
                                </p>

                                <small class="text-muted">
                                    ID: ${p.id}
                                </small>

                            </div>

                            <div class="card-footer bg-transparent border-0 text-end">

                                <button class="btn btn-sm btn-outline-danger"
                                    onclick="deletePlan('${p.id}')">
                                    Delete
                                </button>

                            </div>

                        </div>
                    `;

                    container.appendChild(div);
                });

            } else {
                container.innerHTML = `<p class="text-danger">Failed to load plans</p>`;
            }
        }

        // DELETE PLAN
        async function deletePlan(id) {
            if (!confirm("Delete this plan?")) return;

            const res = await apiRequest(`/plan/delete/${id}`, "DELETE");

            if (res && res.status === 200) {
                showAlert("Deleted successfully", "success");
                loadPlans();
            } else {
                showAlert("Delete failed", "danger");
            }
        }

        // CREATE PLAN
        document.getElementById("createPlanForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const name = document.getElementById("planName").value;
            const price = document.getElementById("planPrice").value;
            const description = document.getElementById("planDescription").value;

            const body = { name, price, description };

            const res = await apiRequest("/plan/create", "POST", body);

            if (res && res.status === 201) {
                showAlert("Plan created", "success");
                e.target.reset();
                loadPlans();
            } else {
                showAlert("Error creating plan", "danger");
            }
        });

        // INIT
        document.addEventListener("DOMContentLoaded", loadPlans);

    </script>

</body>

</html>
