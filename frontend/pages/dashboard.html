<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitAdmin | Premium Gym Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            --dark-bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --sidebar-width: 260px;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* --- Custom Sidebar --- */
        .premium-sidebar {
            width: var(--sidebar-width);
            background: #1e293b;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            padding: 2rem 1.5rem;
            border-right: 1px solid var(--glass-border);
            z-index: 1000;
        }

        .sidebar-brand {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 3rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- Main Content Area --- */
        .main-wrapper {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            padding: 2rem;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
        }

        /* --- Top Navigation --- */
        .top-glass-nav {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- Premium Tabs --- */
        .filter-tabs {
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 14px;
            margin-bottom: 25px;
            width: fit-content;
        }

        .filter-tab {
            padding: 10px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            color: #94a3b8;
            transition: 0.3s all cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
        }

        .filter-tab:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .filter-tab.active-tab {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }

        /* --- Card Styling --- */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            transition: 0.3s transform ease, 0.3s box-shadow ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
        }

        /* --- Inputs & Buttons --- */
        .form-control {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--glass-border);
            color: white;
            border-radius: 10px;
            padding: 12px;
        }

        .form-control:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #3b82f6;
            color: white;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .btn-premium {
            background: var(--primary-gradient);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.3s all;
        }

        .btn-premium:hover {
            opacity: 0.9;
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.4);
        }

        /* --- Status Badges --- */
        .badge {
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.7rem;
        }

        /* --- Animations --- */
        .view-section {
            display: none;
            animation: slideUp 0.4s ease forwards;
        }

        .view-section.active-section {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Fix */
        @media (max-width: 992px) {
            .premium-sidebar {
                display: none !important;
            }

            .main-wrapper {
                margin-left: 0;
            }
        }

        :root {
            /* Premium High-Contrast Palette */
            --bg-deep: #0f172a;
            /* Main Background */
            --sidebar-bg: #1e293b;
            /* Sidebar Background */
            --accent-blue: #3b82f6;
            /* Primary Action Color */
            --text-bright: #ffffff;
            /* Headings & Main Text */
            --text-dim: #94a3b8;
            /* Labels, Placeholders & Secondary Text */
            --glass-bg: rgba(30, 41, 59, 0.7);
            /* Card Background */
            --glass-border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(15, 23, 42, 0.8);
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-bright);
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        /* --- SIDEBAR FIX --- */
        .sidebar,
        .premium-sidebar {
            background: var(--sidebar-bg) !important;
            border-right: 1px solid var(--glass-border);
        }

        .nav-link {
            color: var(--text-dim) !important;
            font-weight: 500;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--text-bright) !important;
            background: rgba(255, 255, 255, 0.05);
        }

        .sidebar-brand,
        .logo-container h3 {
            color: var(--text-bright) !important;
        }

        /* --- TOP NAVBAR FIX --- */
        .top-navbar,
        .top-glass-nav {
            background: rgba(15, 23, 42, 0.9) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            color: var(--text-bright);
        }

        #navTitle,
        #gymNameDisplay {
            color: var(--text-bright) !important;
        }

        /* --- GLOBAL FORM & LABEL FIX (The main visibility issue) --- */
        label,
        .form-label {
            color: var(--text-bright) !important;
            /* Forces labels to be visible */
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
            font-size: 0.9rem;
        }

        .form-control,
        .input-group-text {
            background-color: var(--input-bg) !important;
            border: 1px solid var(--glass-border) !important;
            color: var(--text-bright) !important;
            border-radius: 10px;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3) !important;
        }

        /* --- GLOBAL CARD FIX (Replaces the harsh white/unreadable cards) --- */
        .card,
        .dashboard-card,
        .glass-card,
        .member-glass-card {
            background: var(--glass-bg) !important;
            border: 1px solid var(--glass-border) !important;
            border-radius: 16px !important;
            color: var(--text-bright) !important;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2) !important;
        }

        .card-title,
        h4,
        h5,
        h6,
        strong {
            color: var(--text-bright) !important;
        }

        .text-muted {
            color: var(--text-dim) !important;
        }

        /* --- TABS --- */
        .filter-tabs {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
        }

        .filter-tab {
            color: var(--text-dim) !important;
            transition: 0.3s;
        }

        .filter-tab.active-tab {
            background: var(--accent-blue) !important;
            color: #fff !important;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        /* --- BUTTONS --- */
        .btn-primary,
        .btn-premium,
        .btn-success {
            background: var(--accent-blue) !important;
            border: none !important;
            color: #fff !important;
            font-weight: 600;
            border-radius: 10px;
            padding: 10px 20px;
        }

        .btn-outline-primary {
            border-color: var(--accent-blue) !important;
            color: var(--accent-blue) !important;
        }

        .btn-outline-danger {
            border-color: #ef4444 !important;
            color: #f87171 !important;
        }
    </style>
</head>

<body>
    <div id="global-loader" class="hidden">
        <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div class="premium-sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-dumbbell"></i> FITADMIN
        </div>
        <div class="d-grid gap-2">
            <button class="btn btn-premium w-100 mb-4" onclick="goTo('createMember.html')">
                <i class="fas fa-plus me-2"></i> New Member
            </button>
            <div class="text-muted small fw-bold text-uppercase mb-2">Management</div>
            <nav class="nav flex-column">
                <a class="nav-link text-white opacity-75 py-2 px-0" href="#" onclick="switchView('active')"><i
                        class="fas fa-users me-2"></i> Members</a>
                <a class="nav-link text-white opacity-75 py-2 px-0" href="#" onclick="switchView('plans')"><i
                        class="fas fa-layer-group me-2"></i> Plans</a>
                <a class="nav-link text-white opacity-75 py-2 px-0" href="#" onclick="switchView('events')"><i
                        class="fas fa-calendar-alt me-2"></i> Events</a>
            </nav>
        </div>
    </div>

    <div class="main-wrapper">
        <nav class="top-glass-nav">
            <div>
                <span class="text-muted small d-block">System Dashboard</span>
                <h4 class="m-0 fw-bold" id="navTitle">Members Dashboard</h4>
            </div>
            <div class="d-flex align-items-center gap-4">
                <div class="d-flex align-items-center gap-2" style="cursor: pointer;" onclick="switchView('profile')">
                    <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center"
                        style="width: 40px; height: 40px;">
                        <i class="fas fa-user text-white"></i>
                    </div>
                    <div>
                        <span class="d-block fw-bold small" id="gymNameDisplay">Admin</span>
                        <span class="text-muted tiny" style="font-size: 0.7rem;">Gym Owner</span>
                    </div>
                </div>
                <button class="btn btn-outline-danger btn-sm rounded-pill" id="logoutBtn">Logout</button>
            </div>
        </nav>

        <div id="quickActions" class="mb-4">
        </div>

        <div class="filter-tabs">
            <div class="filter-tab active-tab" onclick="switchView('active')" id="tab-active">
                Active <span class="ms-1 opacity-50" id="count-active">0</span>
            </div>
            <div class="filter-tab" onclick="switchView('pending')" id="tab-pending">
                Pending <span class="ms-1 opacity-50" id="count-pending">0</span>
            </div>
            <div class="filter-tab" onclick="switchView('inactive')" id="tab-inactive">
                Inactive <span class="ms-1 opacity-50" id="count-inactive">0</span>
            </div>
        </div>

        <div id="membersSection" class="view-section active-section">
            <div id="memberList" class="row g-3">
            </div>
        </div>

        <div id="plansSection" class="view-section">
            <div class="row">
                <div class="col-lg-4">
                    <div class="glass-card p-4">
                        <h5 class="fw-bold mb-4">Create Plan</h5>
                        <form id="createPlanForm">
                            <div class="mb-3">
                                <label class="form-label text-muted small">Duration (Months)</label>
                                <input type="number" id="planName" class="form-control" required placeholder="3">
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted small">Price (₹)</label>
                                <input type="number" id="planPrice" class="form-control" required placeholder="1500">
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted small">Description</label>
                                <textarea id="planDescription" class="form-control" rows="3"></textarea>
                            </div>
                            <button type="submit" class="btn btn-premium w-100">Save Plan</button>
                        </form>
                    </div>
                </div>
                <div class="col-lg-8">
                    <div id="plansContainer" class="row g-3"></div>
                </div>
            </div>
        </div>

        <div id="eventsSection" class="view-section">
            <div class="glass-card p-4 mb-4 border-info">
                <h5 id="monthTitle" class="m-0 fw-bold text-info">Events</h5>
                <p id="eventsSubtitle" class="text-muted small m-0"></p>
            </div>
            <div class="row g-3" id="eventsGrid"></div>
        </div>

        <div id="profileSection" class="view-section">
            <div class="glass-card p-4">
                <div class="d-flex align-items-center mb-4">
                    <div class="bg-primary rounded-circle p-2 me-3 d-flex align-items-center justify-content-center"
                        style="width: 45px; height: 45px;">
                        <i class="fas fa-id-card text-white"></i>
                    </div>
                    <h5 class="m-0 fw-bold">Gym Profile Details</h5>
                </div>

                <form id="profileForm">
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label">Gym Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-building"></i></span>
                                <input type="text" id="profile_name" class="form-control" placeholder="Enter Gym Name">
                            </div>
                        </div>

                        <div class="col-md-6 mb-4">
                            <label class="form-label">Owner Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user-tie"></i></span>
                                <input type="text" id="profile_owner_name" class="form-control"
                                    placeholder="Enter Owner Name">
                            </div>
                        </div>

                        <div class="col-md-6 mb-4">
                            <label class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" id="profile_email" class="form-control"
                                    placeholder="gym@example.com">
                            </div>
                        </div>

                        <div class="col-md-6 mb-4">
                            <label class="form-label">Phone Number</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-phone"></i></span>
                                <input type="text" id="profile_phone" class="form-control"
                                    placeholder="+91 00000 00000">
                            </div>
                        </div>

                        <div class="col-12 mb-4">
                            <label class="form-label">Gym Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-map-marker-alt"></i></span>
                                <textarea id="profile_address" class="form-control" rows="3"
                                    placeholder="Enter complete gym address"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end mt-2">
                        <button type="submit" class="btn btn-premium px-5">
                            <i class="fas fa-save me-2"></i> Update Gym Profile
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script>
        checkAuth();

        // Single state
        let currentView = "active";
        const counts = { active: 0, pending: 0, inactive: 0 };

        // Initialize display name
        function initGymName() {
            const gymData = localStorage.getItem("gym");
            if (gymData) {
                try {
                    const gym = JSON.parse(gymData);
                    document.getElementById('gymNameDisplay').textContent = gym.name || gym.username || "Admin";
                } catch (e) { }
            } else {
                apiRequest("/gym/profile").then(res => {
                    if (res && res.status === 200 && res.data.gym) {
                        document.getElementById('gymNameDisplay').textContent = res.data.gym.name;
                        localStorage.setItem("gym", JSON.stringify(res.data.gym));
                    }
                });
            }
        }

        // Fetch counts for tabs
        async function updateCounts() {
            try {
                const [actRes, pndRes, inactRes] = await Promise.all([
                    apiRequest("/member/getAllMembers").catch(() => null),
                    apiRequest("/member/pending").catch(() => null),
                    apiRequest("/member/inactive").catch(() => null)
                ]);

                if (actRes && actRes.status === 200) {
                    const am = actRes.data.members || actRes.data.data || actRes.data || [];
                    counts.active = am.length || 0;
                    document.getElementById('count-active').textContent = counts.active;
                }
                if (pndRes && pndRes.status === 200) {
                    const pm = pndRes.data.members || pndRes.data.data || pndRes.data || [];
                    counts.pending = pm.length || 0;
                    document.getElementById('count-pending').textContent = counts.pending;
                }
                if (inactRes && inactRes.status === 200) {
                    const im = inactRes.data.members || inactRes.data.data || inactRes.data || [];
                    counts.inactive = im.length || 0;
                    document.getElementById('count-inactive').textContent = counts.inactive;
                }
            } catch (e) {
                console.error("Failed to load counts", e);
            }
        }

        // Switch SPA View
        function switchView(viewName) {
            currentView = viewName;

            // 1. Update Tabs Highlight
            document.querySelectorAll(".filter-tab").forEach(t => t.classList.remove("active-tab"));
            const activeTab = document.getElementById(`tab-${viewName}`);
            if (activeTab) activeTab.classList.add("active-tab");

            // 2. Hide all view sections
            document.querySelectorAll(".view-section").forEach(s => s.classList.remove("active-section"));

            // 3. Setup Navigation / Quick Actions
            const navTitle = document.getElementById('navTitle');
            const quickActions = document.getElementById('quickActions');

            if (["active", "pending", "inactive"].includes(viewName)) {
                document.getElementById('membersSection').classList.add("active-section");
                navTitle.textContent = "Members Dashboard";
                quickActions.style.display = "flex";
                loadMembers(viewName);
            } else if (viewName === "plans") {
                document.getElementById('plansSection').classList.add("active-section");
                navTitle.textContent = "Membership Plans";
                quickActions.style.display = "none";
                loadPlans();
            } else if (viewName === "events") {
                document.getElementById('eventsSection').classList.add("active-section");
                navTitle.textContent = "Monthly Events";
                quickActions.style.display = "none";
                loadEvents();
            } else if (viewName === "profile") {
                document.getElementById('profileSection').classList.add("active-section");
                navTitle.textContent = "Gym Profile";
                quickActions.style.display = "none";
                loadProfile();
            }
        }

        function goTo(page) {
            window.location.href = page;
        }

        function formatDate(dateStr) {
            if (!dateStr) return "N/A";

            // Agar already ISO format hai
            const d = new Date(dateStr);

            if (isNaN(d.getTime())) {
                return "N/A"; // invalid date handle
            }

            return d.getFullYear() + "-" +
                String(d.getMonth() + 1).padStart(2, '0') + "-" +
                String(d.getDate()).padStart(2, '0');
        }

        // ======================= MEMBERS LOGIC =======================
        function getApiUrlForMembers(type) {
            if (type === "active") return "/member/getAllMembers";
            if (type === "pending") return "/member/pending";
            if (type === "inactive") return "/member/inactive";
        }

        async function loadMembers(type) {
            const container = document.getElementById("memberList");
            container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>';

            try {
                const res = await apiRequest(getApiUrlForMembers(type));
                container.innerHTML = "";

                let members = [];
                if (res && res.status === 200) {
                    members = res.data.members || res.data.data || res.data;
                }

                if (!Array.isArray(members) || members.length === 0) {
                    container.innerHTML = `<div class="text-center py-5 text-muted"><i class="fas fa-users fs-1 mb-3 opacity-50"></i><h5>No members found</h5></div>`;
                    return;
                }

                members.forEach(m => {
                    let badgeClass = "bg-success";
                    if (m.status === "pending") badgeClass = "bg-warning text-dark";
                    if (m.status === "inactive") badgeClass = "bg-danger";

                    const planName = m.plan_name || (m.plan && m.plan.name) || m.plan_id || "N/A";

                    let actions = `<button class="btn btn-warning btn-sm" onclick="edit('${m._id || m.id}')"><i class="fas fa-edit"></i> Edit</button>`;

                    // Logic: Deactivate button ONLY in Pending members section
                    if (type === "pending") {
                        actions += `<button class="btn btn-success btn-sm ms-2" onclick="activateMember('${m._id || m.id}')"><i class="fas fa-check"></i> Activate</button>`;
                        actions += `<button class="btn btn-danger btn-sm ms-2" onclick="deactivateMember('${m._id || m.id}')"><i class="fas fa-ban"></i> Deactivate</button>`;
                    } else if (type === "inactive") {
                        actions += `<button class="btn btn-success btn-sm ms-2" onclick="activateMember('${m._id || m.id}')"><i class="fas fa-check"></i> Activate</button>`;
                    }
                    // For active, we hide deactivate per requirement: Remove "Deactivate" from Active.

                    container.innerHTML += `
                        <div class="card mb-3 border-0 shadow-sm">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center">
                                    <div class="bg-light rounded-circle p-2 me-3 text-secondary">
                                        <i class="fas fa-user"></i>
                                    </div>
                                    <strong class="fs-5">${m.name}</strong>
                                </div>
                                <div>
                                    <span class="badge ${badgeClass} me-3 text-capitalize">${m.status || type}</span>
                                    <button class="btn btn-sm btn-outline-primary" onclick="toggleDetails('${m._id || m.id}')">
                                        <i class="fas fa-chevron-down"></i> Details
                                    </button>
                                </div>
                            </div>
                            <div id="details-${m._id || m.id}" class="member-details mx-3 mb-3">
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <p class="mb-1 text-muted small">Plan</p>
                                        <p class="fw-medium">${planName}</p>
                                    </div>
                                    <div class="col-md-6">
                                        <p class="mb-1 text-muted small">Fees</p>
                                        <p class="fw-medium">$${m.fees || 0}</p>
                                    </div>
                                    <div class="col-md-6">
                                        <p class="mb-1 text-muted small">Joining Date</p>
                                        <p class="fw-medium">${formatDate(m.date_of_joining || m.createdAt)}</p>
                                    </div>
                                    <div class="col-md-6">
                                        <p class="mb-1 text-muted small">Last Payment</p>
                                        <p class="fw-medium">${formatDate(m.date_of_last_payment)}</p>
                                    </div>
                                </div>
                                <div class="d-flex gap-2">
                                    ${actions}
                                </div>
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="alert alert-danger">Error loading members</div>`;
            }
        }

        function toggleDetails(id) {
            const el = document.getElementById("details-" + id);
            if (el.style.display === "block") {
                el.style.display = "none";
            } else {
                el.style.display = "block";
            }
        }

        function edit(id) {
            window.location.href = `editMember.html?id=${id}`;
        }

        async function activateMember(id) {
            if (confirm("Activate this member?")) {
                const res = await apiRequest(`/member/activate/${id}`, "PATCH");
                if (res && (res.status === 200 || res.status === 201)) {
                    showAlert("Member activated", "success");
                    updateCounts();
                    loadMembers(currentView);
                } else {
                    showAlert("Failed to activate", "danger");
                }
            }
        }

        async function deactivateMember(id) {
            if (confirm("Deactivate this member?")) {
                const res = await apiRequest(`/member/deactivate/${id}`, "PUT");
                if (res && (res.status === 200 || res.status === 201)) {
                    showAlert("Member deactivated", "success");
                    updateCounts();
                    loadMembers(currentView);
                } else {
                    showAlert("Failed to deactivate", "danger");
                }
            }
        }

        // ======================= PLANS LOGIC =======================
        checkAuth();

        // ======================= LOAD PLANS =======================
        async function loadPlans() {
            const container = document.getElementById('plansContainer');

            container.innerHTML = `
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-primary"></div>
        </div>
    `;

            const res = await apiRequest("/plan/getPlans");

            if (res && res.status === 200) {

                const plans = res.data.data || res.data;

                if (plans && plans.length > 0) {

                    container.innerHTML = '';

                    plans.forEach(p => {
                        const div = document.createElement('div');
                        div.className = 'col-md-6 col-lg-4 mb-3';

                        div.innerHTML = `
                    <div class="card h-100 border-0 shadow-sm bg-light">

                        <div class="card-body">

                            <h5 class="card-title fw-bold">${p.name}</h5>

                            <p class="text-success fw-bold mb-1">
                                ₹ ${p.price}
                            </p>

                            <p class="text-muted small mb-2">
                                ${p.description || "No description"}
                            </p>

                            <p class="text-muted small">
                                ID: ${p.id}
                            </p>

                        </div>

                        <div class="card-footer text-end bg-transparent border-0">
                            <button class="btn btn-sm btn-outline-danger"
                                onclick="deletePlan('${p.id}')">
                                Delete
                            </button>
                        </div>

                    </div>
                `;

                        container.appendChild(div);
                    });

                } else {
                    container.innerHTML = `
                <div class="col-12 text-center py-5">
                    <h6 class="text-muted">No plans found</h6>
                </div>
            `;
                }

            } else {
                container.innerHTML = `<div class="text-danger text-center">Failed to load plans</div>`;
            }
        }


        // ======================= DELETE PLAN =======================
        async function deletePlan(id) {
            if (!confirm("Delete this plan?")) return;

            const res = await apiRequest(`/plan/delete/${id}`, "DELETE");

            if (res && res.status === 200) {
                showAlert("Deleted successfully", "success");
                loadPlans();
            } else {
                showAlert(res?.data?.message || "Cannot delete (members exist)", "danger");
            }
        }


        // ======================= CREATE PLAN =======================
        document.getElementById('createPlanForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('planName').value;
            const price = document.getElementById('planPrice').value;
            const description = document.getElementById('planDescription').value;

            const body = { name, price, description };

            const res = await apiRequest("/plan/create", "POST", body);

            if (res && (res.status === 201 || res.status === 200)) {
                showAlert("Plan created successfully!", "success");
                e.target.reset();
                loadPlans();
            } else {
                showAlert(res?.data?.message || "Failed to create plan", "danger");
            }
        });


        // ======================= EVENTS LOGIC =======================
        async function loadEvents() {
            const container = document.getElementById("eventsGrid");
            container.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-info" role="status"></div></div>';

            try {
                const res = await apiRequest("/member/monthly-events");

                if (res && res.status === 200) {
                    const data = res.data;
                    document.getElementById("monthTitle").innerHTML = `<i class="fas fa-calendar-check text-info me-2"></i>Events for ${data.month || "Current Month"}`;
                    document.getElementById("eventsSubtitle").textContent = `Total Upcoming Events: ${data.count || 0}`;

                    const events = data.events || [];

                    if (events.length === 0) {
                        container.innerHTML = `
                            <div class="col-12 text-center py-5">
                                <i class="fas fa-glass-cheers fs-1 text-muted opacity-25 mb-3"></i>
                                <h5 class="text-muted">No events this month</h5>
                                <p class="text-muted small">Check back later for upcoming birthdays or anniversaries.</p>
                            </div>
                        `;
                        return;
                    }

                    container.innerHTML = "";
                    events.forEach(ev => {
                        let iconClass = "fas fa-star";
                        let bgClass = "event-icon-default";
                        let titleText = ev.type || "Event";

                        if (ev.type && ev.type.toLowerCase().includes("birthday")) {
                            iconClass = "fas fa-birthday-cake";
                            bgClass = "event-icon-birthday";
                            titleText = "Birthday";
                        } else if (ev.type && ev.type.toLowerCase().includes("anniversary")) {
                            iconClass = "fas fa-glass-cheers";
                            bgClass = "event-icon-anniversary";
                            titleText = "Anniversary";
                        }

                        container.innerHTML += `
                            <div class="col-md-6 col-lg-4 mb-4">
                                <div class="card event-card h-100 border-0 shadow-sm">
                                    <div class="card-body text-center p-4">
                                        <div class="d-inline-flex justify-content-center align-items-center rounded-circle mb-3 ${bgClass}" style="width: 70px; height: 70px;">
                                            <i class="${iconClass} fs-2"></i>
                                        </div>
                                        <h5 class="fw-bold mb-1">${ev.name}</h5>
                                        <p class="text-muted small mb-2"><i class="fas fa-calendar-day me-1"></i> ${ev.date ? new Date(ev.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : 'Pending'}</p>
                                        <span class="badge bg-light text-dark border border-secondary fw-semibold px-3 py-2 rounded-pill mt-2 text-capitalize">
                                            ${titleText}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    document.getElementById("monthTitle").textContent = "Failed to load events";
                    document.getElementById("eventsSubtitle").textContent = "Ensure the server is running.";
                    container.innerHTML = `<div class="col-12 text-center py-4 text-danger"><i class="fas fa-exclamation-triangle me-2"></i>Could not load events data.</div>`;
                }

            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="col-12 text-center py-4 text-danger">Error loading events.</div>`;
            }
        }

        // ======================= PROFILE LOGIC =======================
        async function loadProfile() {
            const res = await apiRequest("/gym/profile");

            if (res && res.status === 200) {
                const gym = res.data.gym || res.data;

                document.getElementById('profile_name').value = gym.name || "";
                document.getElementById('profile_owner_name').value = gym.owner_name || "";
                document.getElementById('profile_email').value = gym.email || "";
                document.getElementById('profile_phone').value = gym.phone || "";
                document.getElementById('profile_address').value = gym.address || "";

                document.getElementById('gymNameDisplay').textContent = gym.name || "Admin";

                localStorage.setItem("gym", JSON.stringify(gym));
            } else {
                showAlert("Failed to load profile data", "danger");
            }
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                name: document.getElementById('profile_name').value,
                owner_name: document.getElementById('profile_owner_name').value,
                email: document.getElementById('profile_email').value,
                phone: document.getElementById('profile_phone').value,
                address: document.getElementById('profile_address').value
            };

            const res = await apiRequest("/gym/update", "PUT", body);

            if (res && (res.status === 200 || res.status === 201)) {
                showAlert("Profile updated successfully!", "success");
                document.getElementById('gymNameDisplay').textContent = body.name;

                let cachedGym = JSON.parse(localStorage.getItem("gym") || "{}");
                cachedGym = { ...cachedGym, ...body };
                localStorage.setItem("gym", JSON.stringify(cachedGym));

            } else {
                showAlert(res?.data?.message || "Failed to update profile", "danger");
            }
        });



        // INITIALIZATION
        document.addEventListener("DOMContentLoaded", () => {
            initGymName();
            updateCounts();
            switchView('active');
        });

    </script>
</body>

</html>
