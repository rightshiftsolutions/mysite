<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-bg">

    <div id="global-loader" class="hidden">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="auth-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold"><i class="fas fa-dumbbell text-primary"></i> Gym Admin</h2>
            <p class="text-muted">Login to manage your gym</p>
        </div>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" id="username" class="form-control" required placeholder="Enter gym username">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" class="form-control" required placeholder="Enter password">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fs-5 fw-semibold">Login</button>
            <div class="text-center mt-3">
                <a href="register.html" class="text-decoration-none">Don't have an account? Register here</a>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script>
        // Redirect to dashboard if already logged in
        if (localStorage.getItem("token")) {
            window.location.href = "dashboard.html";
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const reqBody = { username, password };
            
            const response = await apiRequest("/gym/login", "POST", reqBody);
            
            if (response && response.status === 200) {
                // response.data contains the token and gym
                localStorage.setItem("token", response.data.token);
                if (response.data.gym) {
                    localStorage.setItem("gym", JSON.stringify(response.data.gym));
                }
                showAlert("Login successful!", "success");
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1000);
            } else {
                showAlert(response?.data?.message || "Invalid credentials", "danger");
            }
        });
    </script>
</body>
</html>
