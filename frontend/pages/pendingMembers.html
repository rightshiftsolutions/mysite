<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Members - Gym Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div id="global-loader" class="hidden">
        <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div class="wrapper">
        <nav class="sidebar">
            <div class="logo-container">
                <h3><i class="fas fa-dumbbell text-primary"></i> FitAdmin</h3>
            </div>
            <ul class="nav-menu">
                <li><a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="profile.html" class="nav-link"><i class="fas fa-building"></i> Gym Profile</a></li>
                <li><a href="events.html" class="nav-link"><i class="fas fa-calendar-alt"></i> Events</a></li>
                <li><a href="pendingMembers.html" class="nav-link active"><i class="fas fa-user-clock"></i> Pending</a>
                </li>
                <li><a href="inactiveMembers.html" class="nav-link"><i class="fas fa-user-slash"></i> Inactive</a></li>
                <li><a href="plan.html" class="nav-link"><i class="fas fa-clipboard-list"></i> Plans</a></li>
            </ul>
        </nav>

        <div class="main-panel">
            <nav class="top-navbar">
                <div class="d-flex align-items-center">
                    <h4 class="m-0 fw-bold text-warning"><i class="fas fa-user-clock me-2"></i>Pending Members</h4>
                </div>
                <button class="btn btn-outline-danger btn-sm rounded-pill px-3" id="logoutBtn">
                    <i class="fas fa-sign-out-alt me-1"></i> Logout
                </button>
            </nav>

            <div class="content">
                <div class="dashboard-card border-top border-warning border-4 mb-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1 fw-bold">Pending Approvals</h5>
                            <p class="text-muted mb-0">Review pending registrations and record payments.</p>
                        </div>
                    </div>
                </div>

                <div class="row" id="membersGrid">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-warning" role="status"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 💰 PAYMENT MODAL -->
    <div class="modal fade" id="paymentModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold"><i class="fas fa-money-bill-wave text-success me-2"></i>Payment
                        Confirmation</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center pt-2">
                    <p id="memberName" class="text-muted mb-4 pb-3 border-bottom"></p>
                    <div class="input-group mb-4">
                        <span class="input-group-text">$</span>
                        <input type="number" id="amount" class="form-control form-control-lg"
                            placeholder="Enter custom amount (optional)">
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-light flex-grow-1 py-2" data-bs-dismiss="modal">Cancel</button>
                        <button class="btn btn-success flex-grow-1 py-2 fw-bold" onclick="confirmPayment()"><i
                                class="fas fa-check-circle me-1"></i> Confirm & Activate</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script>
        checkAuth();

        let selectedMemberId = null;
        let paymentModalInstance = null;

        document.addEventListener("DOMContentLoaded", () => {
            paymentModalInstance = new bootstrap.Modal(document.getElementById('paymentModal'));
            loadPendingMembers();
        });

        function formatDate(dateStr) {
            if (!dateStr) return "N/A";
            return new Date(dateStr).toISOString().split("T")[0];
        }

        async function loadPendingMembers() {
            const container = document.getElementById('membersGrid');
            const res = await apiRequest("/member/pending");

            if (res && res.status === 200) {
                const members = res.data.members || res.data.data || res.data;
                if (members && members.length > 0) {
                    container.innerHTML = '';
                    members.forEach(m => {
                        const planName = m.plan_name || (m.plan && m.plan.name) || m.plan_id || "N/A";

                        const div = document.createElement('div');
                        div.className = 'col-lg-6 mb-4';
                        div.innerHTML = `
                            <div class="card h-100 border-0 shadow-sm">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <div class="d-flex align-items-center">
                                            <div class="bg-light rounded-circle p-2 me-3 text-warning">
                                                <i class="fas fa-user-clock fs-4"></i>
                                            </div>
                                            <h5 class="fw-bold mb-0">${m.name}</h5>
                                        </div>
                                        <span class="badge bg-warning text-dark px-3 py-2 rounded-pill">Pending</span>
                                    </div>
                                    <div class="row g-2 mb-3 text-muted small">
                                        <div class="col-6"><i class="fas fa-clipboard-list me-1"></i> <strong>Plan:</strong> ${planName}</div>
                                        <div class="col-6"><i class="fas fa-dollar-sign me-1"></i> <strong>Fees:</strong> $${m.fees || 0}</div>
                                        <div class="col-6"><i class="fas fa-door-open me-1"></i> <strong>Joined:</strong> ${formatDate(m.date_of_joining || m.createdAt)}</div>
                                        <div class="col-6"><i class="fas fa-calendar-alt me-1"></i> <strong>DOB:</strong> ${formatDate(m.dob)}</div>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <button class="btn btn-outline-primary btn-sm flex-grow-1" onclick="window.location.href='editMember.html?id=${m.id || m._id}'">
                                            <i class="fas fa-edit me-1"></i> Edit
                                        </button>
                                        <button class="btn btn-success btn-sm flex-grow-1 fw-bold" onclick="openPayment('${m.id || m._id}', '${m.name.replace(/'/g, "\\'")}', ${m.fees || 0})">
                                            <i class="fas fa-money-check-alt me-1"></i> Pay
                                        </button>
                                        <button class="btn btn-outline-danger btn-sm" onclick="deactivateMember('${m.id || m._id}')">
                                            <i class="fas fa-ban"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                        container.appendChild(div);
                    });
                } else {
                    container.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="fas fa-check-circle fs-1 text-success opacity-50 mb-3"></i>
                            <h5>All caught up!</h5>
                            <p class="text-muted mb-0">There are currently no pending members awaiting approval.</p>
                        </div>`;
                }
            } else {
                container.innerHTML = '<div class="col-12 text-center py-4 text-danger"><i class="fas fa-exclamation-triangle me-2"></i>Failed to load pending members.</div>';
            }
        }

        function openPayment(id, name, defaultFees) {
            selectedMemberId = id;
            document.getElementById("memberName").innerHTML = `Confirm membership payment for <strong>${name}</strong>?`;
            const amtInput = document.getElementById("amount");
            amtInput.value = defaultFees || "";
            paymentModalInstance.show();
        }

        async function confirmPayment() {
            // Note: If amount needs to be sent to backend, you could add it to body
            const res = await apiRequest(`/member/activate/${selectedMemberId}`, "PATCH");
            if (res && (res.status === 200 || res.status === 201)) {
                paymentModalInstance.hide();
                showAlert("Member Activated Successfully", "success");
                loadPendingMembers();
            } else {
                showAlert(res?.data?.message || "Failed to activate member", "danger");
            }
        }

        async function deactivateMember(id) {
            if (confirm("Reject this pending member and mark inactive?")) {
                const res = await apiRequest(`/member/deactivate/${id}`, "PUT");
                if (res && (res.status === 200 || res.status === 201)) {
                    showAlert("Member marked as inactive.");
                    loadPendingMembers();
                }
            }
        }
    </script>
</body>

</html>
