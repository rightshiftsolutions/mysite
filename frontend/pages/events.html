<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Events - Gym Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .event-card { transition: transform 0.2s; }
        .event-card:hover { transform: translateY(-5px); }
        .event-icon-birthday { color: #fd7e14; background: #ffe8d6; }
        .event-icon-anniversary { color: #e83e8c; background: #fccce5; }
        .event-icon-default { color: #0d6efd; background: #cfe2ff; }
    </style>
</head>
<body>
    <div id="global-loader" class="hidden">
        <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div class="wrapper">
        <nav class="sidebar">
            <div class="logo-container">
                <h3><i class="fas fa-dumbbell text-primary"></i> FitAdmin</h3>
            </div>
            <ul class="nav-menu">
                <li><a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="profile.html" class="nav-link"><i class="fas fa-building"></i> Gym Profile</a></li>
                <li><a href="events.html" class="nav-link active"><i class="fas fa-calendar-alt"></i> Events</a></li>
                <li><a href="pendingMembers.html" class="nav-link"><i class="fas fa-user-clock"></i> Pending</a></li>
                <li><a href="inactiveMembers.html" class="nav-link"><i class="fas fa-user-slash"></i> Inactive</a></li>
                <li><a href="plan.html" class="nav-link"><i class="fas fa-clipboard-list"></i> Plans</a></li>
            </ul>
        </nav>

        <div class="main-panel">
            <nav class="top-navbar">
                <div class="d-flex align-items-center">
                    <h4 class="m-0 fw-bold text-dark"><i class="fas fa-calendar-alt me-2"></i>Monthly Events</h4>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 35px; height: 35px;">
                            <i class="fas fa-user"></i>
                        </div>
                        <span class="fw-medium text-dark" id="gymNameDisplay">Admin</span>
                    </div>
                    <button class="btn btn-outline-danger btn-sm rounded-pill px-3" id="logoutBtn">
                        <i class="fas fa-sign-out-alt me-1"></i> Logout
                    </button>
                </div>
            </nav>

            <div class="content">
                <div class="dashboard-card border-top border-info border-4 mb-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1 fw-bold" id="monthTitle">Loading Events...</h5>
                            <p class="text-muted mb-0" id="eventsSubtitle">Checking records...</p>
                        </div>
                        <div class="bg-info bg-opacity-10 p-3 rounded-circle text-info d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                            <i class="fas fa-calendar-day fs-3"></i>
                        </div>
                    </div>
                </div>

                <div class="row" id="eventsGrid">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-info" role="status"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & Custom JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script>
        checkAuth();

        // Display Gym Name if available
        const gymData = localStorage.getItem("gym");
        if (gymData) {
            try {
                const gym = JSON.parse(gymData);
                document.getElementById('gymNameDisplay').textContent = gym.name || gym.username || "Admin";
            } catch (e) {}
        }

        async function loadEvents() {
            const container = document.getElementById("eventsGrid");
            try {
                const res = await apiRequest("/member/monthly-events");
                
                if (res && res.status === 200) {
                    const data = res.data;
                    document.getElementById("monthTitle").innerHTML = `<i class="fas fa-calendar-check text-info me-2"></i>Events for ${data.month || "Current Month"}`;
                    document.getElementById("eventsSubtitle").textContent = `Total Upcoming Events: ${data.count || 0}`;

                    const events = data.events || [];

                    if (events.length === 0) {
                        container.innerHTML = `
                            <div class="col-12 text-center py-5">
                                <i class="fas fa-glass-cheers fs-1 text-muted opacity-25 mb-3"></i>
                                <h5 class="text-muted">No events this month</h5>
                                <p class="text-muted small">Check back later for upcoming birthdays or anniversaries.</p>
                            </div>
                        `;
                        return;
                    }

                    container.innerHTML = "";
                    events.forEach(ev => {
                        let iconClass = "fas fa-star";
                        let bgClass = "event-icon-default";
                        let titleText = ev.type || "Event";
                        
                        if (ev.type && ev.type.toLowerCase().includes("birthday")) {
                            iconClass = "fas fa-birthday-cake";
                            bgClass = "event-icon-birthday";
                            titleText = "Birthday";
                        } else if (ev.type && ev.type.toLowerCase().includes("anniversary")) {
                            iconClass = "fas fa-glass-cheers";
                            bgClass = "event-icon-anniversary";
                            titleText = "Anniversary";
                        }

                        container.innerHTML += `
                            <div class="col-md-6 col-lg-4 mb-4">
                                <div class="card event-card h-100 border-0 shadow-sm">
                                    <div class="card-body text-center p-4">
                                        <div class="d-inline-flex justify-content-center align-items-center rounded-circle mb-3 ${bgClass}" style="width: 70px; height: 70px;">
                                            <i class="${iconClass} fs-2"></i>
                                        </div>
                                        <h5 class="fw-bold mb-1">${ev.name}</h5>
                                        <p class="text-muted small mb-2"><i class="fas fa-calendar-day me-1"></i> ${ev.date ? new Date(ev.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : 'Pending'}</p>
                                        <span class="badge bg-light text-dark border border-secondary fw-semibold px-3 py-2 rounded-pill mt-2 text-capitalize">
                                            ${titleText}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    document.getElementById("monthTitle").textContent = "Failed to load events";
                    document.getElementById("eventsSubtitle").textContent = "Ensure the server is running.";
                    container.innerHTML = `<div class="col-12 text-center py-4 text-danger"><i class="fas fa-exclamation-triangle me-2"></i>Could not load events data.</div>`;
                }

            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="col-12 text-center py-4 text-danger">Error loading events.</div>`;
            }
        }

        document.addEventListener("DOMContentLoaded", loadEvents);
    </script>
</body>
</html>
