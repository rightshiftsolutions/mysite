<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Gym</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-bg">

    <div id="global-loader" class="hidden">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="auth-card" style="max-width: 500px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold"><i class="fas fa-dumbbell text-primary"></i> Gym Admin</h2>
            <p class="text-muted">Register your new gym</p>
        </div>
        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label">Gym Name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-building"></i></span>
                    <input type="text" id="name" class="form-control" required placeholder="Enter gym name">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" id="username" class="form-control" required placeholder="Create a gym username">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="email" class="form-control" required placeholder="Enter email">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-phone"></i></span>
                    <input type="text" id="phone" class="form-control" required placeholder="Enter phone number">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" class="form-control" required placeholder="Enter password">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fs-5 fw-semibold">Register Gym</button>
            <div class="text-center mt-3">
                <a href="login.html" class="text-decoration-none">Already have an account? Login here</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script>
        if (localStorage.getItem("token")) {
            window.location.href = "dashboard.html";
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            const reqBody = { name, username, email, phone, password };
            
            const response = await apiRequest("/gym/register", "POST", reqBody);
            
            if (response && (response.status === 201 || response.status === 200)) {
                showAlert("Registration successful! Redirecting to login...", "success");
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2000);
            } else {
                showAlert(response?.data?.message || "Registration failed", "danger");
            }
        });
    </script>
</body>
</html>
