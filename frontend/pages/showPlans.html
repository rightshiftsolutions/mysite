<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Plans</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f6f9;
}

.container-box{
    max-width:800px;
    margin:auto;
    margin-top:60px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
</style>

</head>
<body>

<div class="container">
<div class="container-box">

<h3 class="text-center mb-4">Plan Management</h3>

<div class="d-flex justify-content-between mb-3">
    <button class="btn btn-primary" onclick="loadPlans()">Refresh</button>
    <button class="btn btn-danger" onclick="logout()">Logout</button>
</div>

<table class="table table-bordered">
<thead class="table-dark">
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Action</th>
</tr>
</thead>
<tbody id="planTable">
</tbody>
</table>

</div>
</div>

<script>

// ✅ Get token
const token = localStorage.getItem("token");

// 🔒 Protect page
if (!token) {
    alert("Please login first");
    window.location.href = "index.html";
}

// ✅ Load Plans
async function loadPlans(){
    try {
        const res = await fetch("http://localhost:5000/plan/getPlans", {
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        const data = await res.json();

        const table = document.getElementById("planTable");
        table.innerHTML = "";

        data.forEach(plan => {
            table.innerHTML += `
                <tr>
                    <td>${plan.id}</td>
                    <td>${plan.name}</td>
                    <td>
                        <button class="btn btn-danger btn-sm" onclick="deletePlan(${plan.id})">
                            Delete
                        </button>
                    </td>
                </tr>
            `;
        });

    } catch (error) {
        console.error(error);
        alert("Error loading plans");
    }
}

// ✅ Delete Plan
async function deletePlan(id){
    if(!confirm("Are you sure you want to delete this plan?")) return;

    try {
        const res = await fetch(`http://localhost:5000/plan/delete/${id}`, {
            method: "DELETE",
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        const data = await res.json();

        alert(data.message);

        loadPlans(); // 🔄 refresh list

    } catch (error) {
        console.error(error);
        alert("Delete failed");
    }
}

// ✅ Logout
function logout(){
    localStorage.removeItem("token");
    localStorage.removeItem("gym");
    window.location.href = "index.html";
}

// 🚀 Load on page start
loadPlans();

</script>

</body>
</html>
