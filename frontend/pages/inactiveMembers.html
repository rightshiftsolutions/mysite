<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inactive Members - Gym Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div id="global-loader" class="hidden">
        <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div class="wrapper">
                <nav class="sidebar">
            <div class="logo-container">
                <h3><i class="fas fa-dumbbell text-primary"></i> FitAdmin</h3>
            </div>
            <ul class="nav-menu">
                <li><a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="profile.html" class="nav-link"><i class="fas fa-building"></i> Gym Profile</a></li>
                <li><a href="events.html" class="nav-link"><i class="fas fa-calendar-alt"></i> Events</a></li>
                <li><a href="pendingMembers.html" class="nav-link"><i class="fas fa-user-clock"></i> Pending</a></li>
                <li><a href="inactiveMembers.html" class="nav-link active"><i class="fas fa-user-slash"></i> Inactive</a></li>
                <li><a href="plan.html" class="nav-link"><i class="fas fa-clipboard-list"></i> Plans</a></li>
            </ul>
        </nav>

        <div class="main-panel">
            <nav class="top-navbar">
                <div class="d-flex align-items-center">
                    <h4 class="m-0 fw-bold text-danger"><i class="fas fa-user-slash me-2"></i>Inactive Members</h4>
                </div>
                <button class="btn btn-outline-danger btn-sm rounded-pill px-3" id="logoutBtn">
                    <i class="fas fa-sign-out-alt me-1"></i> Logout
                </button>
            </nav>

            <div class="content">
                <div class="row" id="membersGrid">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-danger" role="status"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script>
        checkAuth();

        function formatDate(dateStr) {
            if (!dateStr) return "N/A";
            return new Date(dateStr).toISOString().split("T")[0];
        }

        async function loadInactiveMembers() {
            const container = document.getElementById('membersGrid');
            const res = await apiRequest("/member/inactive");

            if (res && res.status === 200) {
                const members = res.data.members || res.data.data || res.data;
                if (members && members.length > 0) {
                    container.innerHTML = '';
                    members.forEach(m => {
                        const planName = m.plan_name || (m.plan && m.plan.name) || m.plan_id || "N/A";

                        const div = document.createElement('div');
                        div.className = 'col-lg-6 mb-4';
                        div.innerHTML = `
                            <div class="card h-100 border-0 shadow-sm opacity-75">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <div class="d-flex align-items-center">
                                            <div class="bg-light rounded-circle p-2 me-3 text-danger">
                                                <i class="fas fa-user-slash fs-4"></i>
                                            </div>
                                            <h5 class="fw-bold mb-0 text-decoration-line-through">${m.name}</h5>
                                        </div>
                                        <span class="badge bg-danger px-3 py-2 rounded-pill">Inactive</span>
                                    </div>
                                    <div class="row g-2 mb-3 text-muted small">
                                        <div class="col-6"><i class="fas fa-clipboard-list me-1"></i> <strong>Plan:</strong> ${planName}</div>
                                        <div class="col-6"><i class="fas fa-dollar-sign me-1"></i> <strong>Fees:</strong> $${m.fees || 0}</div>
                                        <div class="col-6"><i class="fas fa-door-open me-1"></i> <strong>Joined:</strong> ${formatDate(m.date_of_joining || m.createdAt)}</div>
                                        <div class="col-6"><i class="fas fa-history me-1"></i> <strong>Last Payment:</strong> ${formatDate(m.date_of_last_payment)}</div>
                                    </div>
                                    <button class="btn btn-outline-success w-100 fw-medium" onclick="reactivateMember('${m.id || m._id}')">
                                        <i class="fas fa-undo-alt me-1"></i> Reactivate Member
                                    </button>
                                </div>
                            </div>
                        `;
                        container.appendChild(div);
                    });
                } else {
                    container.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="fas fa-users fs-1 opacity-50 text-muted mb-3"></i>
                            <h5 class="text-muted">No inactive members</h5>
                            <p class="text-muted mb-0">Every member is currently active and healthy!</p>
                        </div>`;
                }
            } else {
                container.innerHTML = '<div class="col-12 text-center py-4 text-danger"><i class="fas fa-exclamation-triangle me-2"></i>Failed to load inactive members.</div>';
            }
        }

        async function reactivateMember(id) {
            if (confirm("Reactivate this member?")) {
                const res = await apiRequest(`/member/activate/${id}`, "PATCH");
                if (res && (res.status === 200 || res.status === 201)) {
                    showAlert("Member reactivated successfully!", "success");
                    loadInactiveMembers();
                } else {
                    showAlert(res?.data?.message || "Failed to reactivate member", "danger");
                }
            }
        }

        document.addEventListener("DOMContentLoaded", loadInactiveMembers);
    </script>
</body>

</html>
