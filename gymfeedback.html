<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rate Your Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c14;
    --surface: rgba(255,255,255,0.04);
    --surface-2: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.08);
    --border-glow: rgba(99,179,237,0.3);
    --accent: #63b3ed;
    --accent-2: #9f7aea;
    --gold: #f6c90e;
    --gold-dim: rgba(246,201,14,0.18);
    --success: #48bb78;
    --danger: #fc8181;
    --text: #f0f4ff;
    --text-dim: rgba(240,244,255,0.45);
    --text-mid: rgba(240,244,255,0.7);
    --radius: 20px;
    --radius-sm: 12px;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Ambient background */
  body::before {
    content:'';
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(99,179,237,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(159,122,234,0.1) 0%, transparent 60%);
    pointer-events:none; z-index:0;
  }

  .noise {
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  }

  .container {
    position:relative; z-index:1;
    max-width: 480px; margin:0 auto;
    padding: 0 0 60px;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }

  /* Header */
  .header {
    width: 100%; padding: 36px 24px 28px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    animation: fadeDown 0.6s ease both;
  }

  .logo-wrap {
    width: 80px; height: 80px; border-radius: 22px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size: 36px;
    box-shadow: 0 0 40px rgba(99,179,237,0.15), 0 8px 32px rgba(0,0,0,0.4);
    backdrop-filter: blur(12px);
    position: relative; overflow: hidden;
  }
  .logo-wrap::after {
    content:''; position:absolute; inset:0;
    background: linear-gradient(135deg, rgba(99,179,237,0.12), transparent);
  }

  .gym-name {
    font-family: 'Syne', sans-serif;
    font-size: 22px; font-weight: 800;
    letter-spacing: -0.3px;
    text-align: center;
    background: linear-gradient(135deg, #fff 40%, var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .greeting {
    font-size: 13px; color: var(--text-dim); letter-spacing: 0.5px;
  }

  /* Glass Card */
  .card {
    width: calc(100% - 32px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 22px;
    backdrop-filter: blur(20px);
    box-shadow: 0 4px 40px rgba(0,0,0,0.3);
    margin-bottom: 14px;
    animation: fadeUp 0.5s ease both;
  }

  .card-label {
    font-size: 11px; font-weight: 500; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--accent);
    margin-bottom: 8px;
  }
  .card-question {
    font-family: 'Syne', sans-serif;
    font-size: 17px; font-weight: 700;
    line-height: 1.4; margin-bottom: 20px;
    color: var(--text);
  }

  /* Stars */
  .stars {
    display: flex; gap: 10px; justify-content: center;
    margin-bottom: 4px;
  }
  .star {
    font-size: 38px; cursor: pointer;
    transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), filter 0.18s ease;
    filter: grayscale(1) brightness(0.5);
    user-select: none;
  }
  .star.active { filter: none; }
  .star:hover { transform: scale(1.15); }
  .star.pop { animation: starPop 0.3s cubic-bezier(.34,1.56,.64,1) both; }

  .star-hint {
    text-align: center; font-size: 12px; color: var(--text-dim);
    min-height: 18px; margin-top: 6px;
    transition: opacity 0.2s;
  }

  /* Main Buttons */
  .main-btns {
    width: calc(100% - 32px);
    display: flex; flex-direction: column; gap: 12px;
    animation: fadeUp 0.6s 0.1s ease both;
  }

  .btn {
    width: 100%; border: none; cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-weight: 700; font-size: 15px;
    letter-spacing: 0.3px;
    border-radius: var(--radius-sm);
    padding: 18px 20px;
    position: relative; overflow: hidden;
    transition: transform 0.12s ease, box-shadow 0.15s ease;
    -webkit-appearance: none;
  }
  .btn:active { transform: scale(0.97); }
  .btn::after {
    content:''; position:absolute; inset:0; border-radius:inherit;
    background: radial-gradient(circle at var(--rx,50%) var(--ry,50%), rgba(255,255,255,0.18) 0%, transparent 60%);
    opacity:0; transition: opacity 0.3s;
    pointer-events:none;
  }
  .btn.ripple::after { opacity:1; animation: rippleFade 0.5s ease forwards; }

  .btn-primary {
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: #fff;
    box-shadow: 0 4px 24px rgba(99,102,241,0.45), 0 1px 0 rgba(255,255,255,0.12) inset;
  }
  .btn-primary:hover { box-shadow: 0 6px 32px rgba(99,102,241,0.6); }

  .btn-ghost {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-mid);
    font-size: 14px; font-weight: 600;
    backdrop-filter: blur(8px);
  }
  .btn-ghost:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }

  .btn-danger {
    background: rgba(252,129,129,0.08);
    border: 1px solid rgba(252,129,129,0.2);
    color: var(--danger);
    font-size: 14px; font-weight: 600;
    backdrop-filter: blur(8px);
  }

  /* Steps */
  #step-rating {
    display: none; width: 100%;
    flex-direction: column; align-items: center;
    padding: 0 0 20px;
    gap: 0;
    animation: fadeUp 0.4s ease both;
  }

  /* Review copy section */
  #step-copy {
    display: none; width: calc(100% - 32px);
    animation: fadeUp 0.4s ease both;
  }

  .review-box {
    background: var(--surface-2);
    border: 1px solid var(--border-glow);
    border-radius: var(--radius-sm);
    padding: 20px;
    font-size: 15px; line-height: 1.7;
    color: var(--text);
    margin-bottom: 14px;
    position: relative;
  }
  .review-box .review-line { display: block; }
  .review-box .review-line + .review-line { margin-top: 6px; }

  .copy-badge {
    display: flex; align-items: center; gap: 8px;
    background: rgba(72,187,120,0.12);
    border: 1px solid rgba(72,187,120,0.3);
    border-radius: 10px; padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 14px; color: var(--success); font-weight: 600;
  }

  .btn-success {
    background: linear-gradient(135deg, #38a169, #48bb78);
    color: #fff;
    box-shadow: 0 4px 20px rgba(72,187,120,0.4);
  }

  /* Loading Spinner */
  .spinner-wrap {
    display: none; flex-direction: column; align-items: center;
    gap: 12px; padding: 24px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  .spinner-text { font-size: 13px; color: var(--text-dim); }

  /* Toast */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(30,40,60,0.95); border: 1px solid var(--border-glow);
    border-radius: 50px; padding: 12px 22px;
    font-size: 14px; font-weight: 500; color: var(--text);
    white-space: nowrap;
    backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    z-index: 1000; opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Success tick animation */
  .tick-anim {
    display: none; flex-direction: column; align-items: center; gap: 8px;
    padding: 12px 0 0;
  }
  .tick-circle {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, #38a169, #68d391);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    box-shadow: 0 0 30px rgba(72,187,120,0.5);
    animation: tickPop 0.4s cubic-bezier(.34,1.56,.64,1) both;
  }

  /* Divider */
  .divider {
    width: calc(100% - 32px);
    height: 1px; background: var(--border);
    margin: 6px 0 14px;
  }

  /* Overlay spinner */
  .overlay {
    display: none; position: fixed; inset: 0; z-index: 500;
    background: rgba(8,12,20,0.7); backdrop-filter: blur(4px);
    align-items: center; justify-content: center;
    flex-direction: column; gap: 14px;
  }
  .overlay.show { display: flex; }
  .overlay .spinner { width: 48px; height: 48px; border-width: 4px; }
  .overlay-text { font-size: 15px; color: var(--text-mid); }

  /* Disabled state */
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }

  /* Keyframes */
  @keyframes fadeDown {
    from { opacity:0; transform: translateY(-20px); }
    to { opacity:1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(24px); }
    to { opacity:1; transform: translateY(0); }
  }
  @keyframes starPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  @keyframes rippleFade {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes tickPop {
    0% { transform: scale(0); opacity:0; }
    100% { transform: scale(1); opacity:1; }
  }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  .done-state {
    text-align: center; padding: 32px 16px;
    animation: fadeUp 0.4s ease both;
  }
  .done-state .done-icon { font-size: 52px; margin-bottom: 12px; }
  .done-state h3 { font-family:'Syne',sans-serif; font-size:20px; font-weight:800; margin-bottom:6px; }
  .done-state p { font-size:14px; color:var(--text-dim); }

  .section-gap { height: 8px; }
</style>
</head>

<div class="noise"></div>

<div class="overlay" id="overlay">

  </div>

  <!-- MAIN BUTTONS (Step 0) -->

    <button class="btn btn-primary" id="btnProvideReview" onclick="startReview()">
      ⭐ PLEASE PROVIDE REVIEW
    </button>
    <button class="btn btn-ghost" id="btnAlreadyGiven" onclick="statusUpdate(1,this)">
      ✅ I HAVE ALREADY GIVEN GOOGLE REVIEW
    </button>
    <button class="btn btn-danger" id="btnNotInterested" onclick="statusUpdate(2,this)">
      ✕ NOT INTERESTED
    </button>
  </div>

  <div class="section-gap"></div>

  <!-- STEP: RATING -->
  <div id="step-rating">

    <!-- Gym Rating Card -->
    <div class="card" id="card-gym-rating">
      <div class="card-label">Step 1 of 2</div>
      <div class="card-question" id="q1">How do you feel about the gym?</div>
      <div class="stars" id="stars-gym">
        <span class="star" data-val="1" onclick="setRating('gym',1)">⭐</span>
        <span class="star" data-val="2" onclick="setRating('gym',2)">⭐</span>
        <span class="star" data-val="3" onclick="setRating('gym',3)">⭐</span>
        <span class="star" data-val="4" onclick="setRating('gym',4)">⭐</span>
        <span class="star" data-val="5" onclick="setRating('gym',5)">⭐</span>
      </div>
      <div class="star-hint" id="hint-gym">Tap to rate</div>
    </div>

    <!-- Trainer Rating Card -->
    <div class="card" id="card-trainer-rating" style="opacity:0.4;pointer-events:none;transition:opacity 0.3s">
      <div class="card-label">Step 2 of 2</div>
      <div class="card-question" id="q2">Rate your trainer</div>
      <div class="stars" id="stars-trainer">
        <span class="star" data-val="1" onclick="setRating('trainer',1)">⭐</span>
        <span class="star" data-val="2" onclick="setRating('trainer',2)">⭐</span>
        <span class="star" data-val="3" onclick="setRating('trainer',3)">⭐</span>
        <span class="star" data-val="4" onclick="setRating('trainer',4)">⭐</span>
        <span class="star" data-val="5" onclick="setRating('trainer',5)">⭐</span>
      </div>
      <div class="star-hint" id="hint-trainer">Tap to rate</div>
    </div>

  </div>

  <!-- STEP: COPY REVIEW -->
  <div id="step-copy">

    <div class="card">
      <div class="card-label">Your Review is Ready ✨</div>
      <div class="review-box" id="review-box">
        <span class="review-line" id="review-line1"></span>
        <span class="review-line" id="review-line2"></span>
      </div>
      <div class="copy-badge">
        <span>📋</span>
        <span>Review copied! Just paste in Google</span>
      </div>
      <div class="tick-anim" id="tick-anim" style="display:flex">
        <div class="tick-circle">✓</div>
      </div>
    </div>

    <button class="btn btn-success" style="width:calc(100% - 0px);margin:0 0 12px" onclick="openGoogleReview()">
      🌟 OPEN GOOGLE REVIEW &amp; PASTE
    </button>

  </div>

  <!-- DONE STATE -->
  <div id="step-done" style="display:none;width:100%">
    <div class="done-state">
      <div class="done-icon">🎉</div>
      <h3>Thank You!</h3>
      <p>Your feedback means the world to us.</p>
    </div>
  </div>

</div>

// Track last used index per rating to avoid repeats
const lastUsed = {};

function getReview(gymR, trainerR) {
  const avgR = Math.round((gymR + trainerR) / 2);
  const rating = Math.max(1, Math.min(5, avgR));
  const pool = reviews[rating];
  const key = `r${rating}`;
  let idx;
  do { idx = Math.floor(Math.random() * pool.length); } while (idx === lastUsed[key] && pool.length > 1);
  lastUsed[key] = idx;
  const [line1, line2] = pool[idx];
  return [
    line1.replace('{t}', trainerName),
    line2.replace('{t}', trainerName)
  ];
}

// ─── RATING ─────────────────────────────────────────────────────────────────
function setRating(type, val) {
  if (type === 'gym') {
    gymRating = val;
    updateStars('stars-gym', val);
    document.getElementById('hint-gym').textContent = starHints[val];
    // unlock trainer
    const tc = document.getElementById('card-trainer-rating');
    tc.style.opacity = '1'; tc.style.pointerEvents = 'auto';
    setTimeout(() => tc.scrollIntoView({behavior:'smooth', block:'center'}), 200);
  } else {
    trainerRating = val;
    updateStars('stars-trainer', val);
    document.getElementById('hint-trainer').textContent = starHints[val];
    if (gymRating > 0) {
      setTimeout(showCopyStep, 600);
    }
  }
}

function updateStars(containerId, val) {
  const stars = document.querySelectorAll(`#${containerId} .star`);
  stars.forEach((s, i) => {
    s.classList.toggle('active', i < val);
    if (i === val - 1) { s.classList.add('pop'); setTimeout(() => s.classList.remove('pop'), 350); }
  });
}

// ─── FLOW ────────────────────────────────────────────────────────────────────
function startReview() {
  ripple(event);

  // Open Google review in background tab, immediately pull focus back here
  googleTab = window.open(googleReviewUrl, '_blank');
  // Steal focus back instantly — user never sees the tab switch
  window.focus();
  if (googleTab) googleTab.blur();

  // Show rating UI
  document.getElementById('step-main').style.display = 'none';
  const sr = document.getElementById('step-rating');
  sr.style.display = 'flex';
  setTimeout(() => sr.scrollIntoView({behavior:'smooth'}), 100);
}

async function showCopyStep() {
  const [line1, line2] = getReview(gymRating, trainerRating);
  document.getElementById('review-line1').textContent = line1;
  document.getElementById('review-line2').textContent = line2;

  document.getElementById('step-rating').style.display = 'none';
  document.getElementById('step-copy').style.display = 'block';

  // Copy to clipboard
  try {
    await navigator.clipboard.writeText(line1 + '\n' + line2);
  } catch(e) {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = line1 + '\n' + line2;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  }
  showToast('📋 Review copied to clipboard!');
  // Update API as done
  await callStatusApi(1);
}

function openGoogleReview() {
  ripple(event);
  if (googleTab && !googleTab.closed) {
    googleTab.focus();
  } else {
    window.open(googleReviewUrl, '_blank');
  }
  setTimeout(showDone, 1200);
}

function showDone() {
  document.getElementById('step-main').style.display = 'none';
  document.getElementById('step-rating').style.display = 'none';
  document.getElementById('step-copy').style.display = 'none';
  document.getElementById('step-done').style.display = 'block';
}

// ─── API ─────────────────────────────────────────────────────────────────────

// Auth headers used in every request
function authHeaders() {
  return {
    'Content-Type': 'application/json',
    ...(authToken ? { 'Authorization': `Bearer ${authToken}` } : {})
  };
}

// Step 1: GET current social status to preserve existing values
async function fetchCurrentStatus() {
  const res = await fetch(
    `https://www.api.gymgurus.in/member/social-media`,
    { headers: authHeaders() }
  );
  if (!res.ok) throw new Error(`GET failed: ${res.status}`);
  const json = await res.json();
  // API returns data array — find current member
  const member = Array.isArray(json.data)
    ? json.data.find(m => String(m.id) === String(memberId)) || json.data[0]
    : json.data;
  return member;
}

async function statusUpdate(status, el) {
  if (el) ripple({ currentTarget: el, clientX: 0, clientY: 0 });
  document.querySelectorAll('.btn').forEach(b => b.disabled = true);
  await callStatusApi(status);
  showDone();
}

async function callStatusApi(status) {
  const overlay = document.getElementById('overlay');
  const overlayText = document.getElementById('overlay-text');
  overlay.classList.add('show');

  try {
    // Step 1: GET existing values
    overlayText.textContent = 'Fetching current status...';
    const current = await fetchCurrentStatus();

    // Step 2: PUT with only googleReview changed, all others preserved
    overlayText.textContent = status === 1 ? 'Saving your review...' : 'Updating status...';
    const body = {
      memberId : Number(memberId),
      gymId    : Number(gymId),
      insta        : current.insta        ?? 0,
      youtube      : current.youtube      ?? 0,
      whatsapp     : current.whatsapp     ?? 0,
      googleReview : status,                    // ← only this changes
      telegram     : current.telegram     ?? 0,
      linkdin      : current.linkdin      ?? 0,
    };

    const putRes = await fetch(
      'https://www.api.gymgurus.in/member/update-social-status',
      { method: 'PUT', headers: authHeaders(), body: JSON.stringify(body) }
    );
    if (!putRes.ok) throw new Error(`PUT failed: ${putRes.status}`);

    if (status === 1) showToast('✅ Thank you for your review!');
    if (status === 2) showToast('Noted! Maybe next time 😊');

  } catch(e) {
    console.error('API error:', e);
    showToast('⚠️ Could not update status. Please try again.');
    document.querySelectorAll('.btn').forEach(b => b.disabled = false);
  }

  overlay.classList.remove('show');
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
function showToast(msg, dur=3000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

function ripple(e) {
  if (!e || !e.currentTarget) return;
  const btn = e.currentTarget;
  const rect = btn.getBoundingClientRect();
  const x = ((e.clientX || rect.left + rect.width/2) - rect.left) / rect.width * 100;
  const y = ((e.clientY || rect.top + rect.height/2) - rect.top) / rect.height * 100;
  btn.style.setProperty('--rx', x+'%');
  btn.style.setProperty('--ry', y+'%');
  btn.classList.remove('ripple');
  void btn.offsetWidth;
  btn.classList.add('ripple');
}

// Add ripple to all btns
document.querySelectorAll('.btn').forEach(b => {
  b.addEventListener('click', function(e){ ripple({currentTarget:b, clientX:e.clientX, clientY:e.clientY}); });
});
</script>
