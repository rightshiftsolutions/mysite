<!DOCTYPE html>
<html>
<head>
  <title>PoweHouseGym</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="app-wrapper">

  <!-- Top Bar -->
  <div class="top-bar">

    <button class="back-btn">

      <i class="fa-solid fa-chevron-left"></i>

    </button>

  </div>

  <!-- Profile Card -->
  <div class="profile-card glass-card">

    <div class="stats-row">

      <div class="stat">

        <span class="stat-num">
          1.2K
        </span>

        <span class="stat-label">
          Followers
        </span>

      </div>

      <div class="avatar-wrap">

        <img
          src="https://xyz.com/logo.webp"
          class="avatar"
          alt="PoweHouseGym"
        >

        <span class="verified-badge">

          <i class="fa-solid fa-check"></i>

        </span>

      </div>

      <div class="stat">

        <span class="stat-num">
          4.5K
        </span>

        <span class="stat-label">
          Likes
        </span>

      </div>

    </div>

    <h1 class="profile-name">
      PoweHouseGym
    </h1>

    <p class="profile-subtitle">
      Best gym in Jaipur
    </p>

    <!-- Social Links -->
    <div class="social-row">

      <a href="#" class="social-btn">

        <i class="fa-brands fa-instagram"></i>

      </a>

      <a href="#" class="social-btn">

        <i class="fa-brands fa-youtube"></i>

      </a>

      <a href="#" class="social-btn">

        <i class="fa-brands fa-linkedin-in"></i>

      </a>

    </div>

    <!-- Buttons -->
    <div class="action-row">

      <button class="btn btn-outline">

        Information

      </button>

      <button class="btn btn-solid">

        Message

      </button>

    </div>

  </div>

  <!-- Services -->
  <div class="section-label">

    Services

  </div>


  <div class="content-card glass-card service-card">

    <div class="card-icon">

      <i class="fa-solid fa-star"></i>

    </div>

    <div class="card-text">

      <span class="card-title">

        Personal Training

      </span>

    </div>

    <button class="card-action-btn">

      Add

    </button>

  </div>


  <div class="content-card glass-card service-card">

    <div class="card-icon">

      <i class="fa-solid fa-star"></i>

    </div>

    <div class="card-text">

      <span class="card-title">

        Crossfit

      </span>

    </div>

    <button class="card-action-btn">

      Add

    </button>

  </div>


  <!-- Offers -->
  <div class="section-label">

    Offers

  </div>


  <div class="content-card glass-card offer-card">

    <div class="offer-tag">

      Offer

    </div>

    <div class="card-title">

      50% OFF

    </div>

    <div class="card-cta">

      View More →

    </div>

  </div>


  <!-- Gallery -->
  <div class="section-label">

    Gallery

  </div>

  <div class="gallery-grid">


    <div class="gallery-item">

      <img
        src="https://xyz.com/1.webp"
        alt="Gallery"
      >

    </div>


    <div class="gallery-item">

      <img
        src="https://xyz.com/2.webp"
        alt="Gallery"
      >

    </div>


  </div>

  <!-- Save Contact -->
  <a
    href="contact.vcf"
    class="save-contact-btn"
  >

    <i class="fa-solid fa-address-card"></i>

    Save Contact

  </a>

 

</div>

<script src="app.js"></script>

</body>
</html>
