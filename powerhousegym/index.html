<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>PowerGym</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="app-wrapper">

  <!-- Top Bar -->
  <div class="top-bar"></div>

  <!-- Profile Card -->
  <div class="profile-card glass-card">

    <!-- Avatar -->
    <div class="stats-row">
      <div class="avatar-wrap">
        <img
          src="https://rightshiftsolutions.github.io/mysite/powerhousegym/images/profile/profile.webp"
          class="profile-img"
          alt="PowerGym Profile"
        />
        <span class="verified-badge">
          <i class="fa-solid fa-check"></i>
        </span>
      </div>
    </div>

    <!-- Name & Subtitle -->
    <h1 class="profile-name">PowerGym</h1>
    <p class="profile-subtitle">Transform Your Body, Transform Your Life</p>

    <div class="divider"></div>

    <!-- Social Links -->
    <div class="social-row">
      <a href="https://www.instagram.com/_26_fitness_club_?igsh=a3FkOW1vaHJleHFk" class="social-btn" target="_blank" rel="noopener" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://www.youtube.com/@_vampire29" class="social-btn" target="_blank" rel="noopener" aria-label="YouTube">
        <i class="fa-brands fa-youtube"></i>
      </a>
      <a href="https://wa.me/9887566773" class="social-btn" target="_blank" rel="noopener" aria-label="WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
      </a>
    </div>

    <!-- Services -->
    <div class="section-label">Services</div>

    <div class="content-card glass-card service-card">
      <div class="card-icon"><i class="fa-solid fa-star"></i></div>
      <div class="card-text">
        <span class="card-title">Personal Training</span>
      </div>
    </div>

    <div class="content-card glass-card service-card">
      <div class="card-icon"><i class="fa-solid fa-star"></i></div>
      <div class="card-text">
        <span class="card-title">Crossfit</span>
      </div>
    </div>

    <div class="content-card glass-card service-card">
      <div class="card-icon"><i class="fa-solid fa-star"></i></div>
      <div class="card-text">
        <span class="card-title">Strength Training</span>
      </div>
    </div>

    <!-- Offers -->
    <div class="section-label">Offers</div>

    <div class="content-card glass-card offer-card">
      <div class="offer-tag">Offer</div>
      <div class="card-title">50% OFF FOR 1 MONTH</div>
    </div>

    <div class="content-card glass-card offer-card">
      <div class="offer-tag">Offer</div>
      <div class="card-title">Free Personal Training For 7 Days</div>
    </div>

    <!-- Gallery -->
    <div class="section-label">Gallery</div>

    <div class="gallery-scroll">
      <div class="gallery-item">
        <img src="https://rightshiftsolutions.github.io/mysite/powerhousegym/images/gallery/1778675745291-8.webp" alt="Gallery 1">
      </div>
      <div class="gallery-item">
        <img src="https://rightshiftsolutions.github.io/mysite/powerhousegym/images/gallery/1778675747678-7.webp" alt="Gallery 2">
      </div>
      <div class="gallery-item">
        <img src="https://rightshiftsolutions.github.io/mysite/powerhousegym/images/gallery/1778675749317-WhatsApp Image 2026-05-13 at 17.webp" alt="Gallery 3">
      </div>
    </div>

    <!-- Save Contact -->
    <a href="contact.vcf" class="save-contact-btn">
      <i class="fa-solid fa-address-card"></i>
      Save Contact
    </a>

  </div><!-- /profile-card -->

</div><!-- /app-wrapper -->

<script src="app.js"></script>
</body>
</html>
