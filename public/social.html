<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />

  <title>Gym Social Connect</title>

  <link rel="stylesheet" href="style.css" />

</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">🏋️</div>

      <!-- GYM NAME -->

      <h1 id="gymName">
        Loading...
      </h1>

      <!-- MESSAGE -->

      <p id="message">
        Connecting...
      </p>

      <!-- REVIEW PREVIEW -->

      <div id="reviewBox"
           style="display:none;">

        <textarea
          id="reviewText"
          readonly></textarea>

      </div>

      <!-- ACTION BUTTON -->

      <button
        id="actionBtn"
        class="btn"
        style="display:none;">

        OPEN

      </button>

      <!-- SUCCESS -->

      <div
        id="successMsg"
        style="display:none;">

        ✅ Review copied successfully

      </div>

    </div>

  </div>

  <script src="app.js"></script>

</body>

</html>
